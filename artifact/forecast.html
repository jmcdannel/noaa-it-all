:root{
  --hl:color-mix(in srgb, var(--cover) 42%, var(--page)); --day:color-mix(in srgb, var(--cover) 11%, var(--page)); --night:color-mix(in srgb, var(--lo) 11%, var(--page));
  --storm:color-mix(in srgb, var(--lo) 16%, var(--label)); --alert:color-mix(in srgb, var(--cover) 18%, var(--page)); --alert-sev:color-mix(in srgb, var(--warn) 11%, var(--page));
  --cover:#E9B300; --cover-ink:#22262A; --label:#FFFFFF;
  --page:#F4F7F1; --page-2:#E8EEE6;
  --ink:#22262A; --ink-2:#3E5246; --rule:#2F6B4F; --rule-soft:rgba(47,107,79,.28);
  --now:#C2410C; --warn:#A61B1B; --scrim:rgba(20,24,26,.48);
  --hi:#B93E0A; --lo:#1D5AA6;
  --font:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cover:#D19E0B; --cover-ink:#121517; --label:#1B2023;
    --page:#121517; --page-2:#1B2023;
    --ink:#E4EAE3; --ink-2:#AFC2B5; --rule:#6FA88A; --rule-soft:rgba(111,168,138,.28);
    --now:#F07A3A; --warn:#FF8A80; --scrim:rgba(0,0,0,.6); --hi:#FF8F52; --lo:#7DB3FF; --day:color-mix(in srgb, var(--cover) 5%, var(--page)); --night:color-mix(in srgb, var(--lo) 13%, var(--page)); --hl:color-mix(in srgb, var(--cover) 50%, var(--page)); --alert:color-mix(in srgb, var(--cover) 9%, var(--page-2));
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cover:#D19E0B; --cover-ink:#121517; --label:#1B2023;
  --page:#121517; --page-2:#1B2023;
  --ink:#E4EAE3; --ink-2:#AFC2B5; --rule:#6FA88A; --rule-soft:rgba(111,168,138,.28);
  --now:#F07A3A; --warn:#FF8A80; --scrim:rgba(0,0,0,.6); --hi:#FF8F52; --lo:#7DB3FF; --day:color-mix(in srgb, var(--cover) 5%, var(--page)); --night:color-mix(in srgb, var(--lo) 13%, var(--page)); --hl:color-mix(in srgb, var(--cover) 50%, var(--page)); --alert:color-mix(in srgb, var(--cover) 9%, var(--page-2));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overflow:hidden;
  display:grid;grid-template-rows:1fr auto;}
::selection{background:var(--cover);color:var(--cover-ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--rule)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* book: one page per place, a hard snap apart */
.book{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;min-height:0}
.book::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-align:start;scroll-snap-stop:always;scrollbar-color:var(--rule-soft) transparent}

/* cover band */
.cover{background:var(--cover);color:var(--cover-ink);border-bottom:1px solid var(--cover-ink);
  padding:calc(env(safe-area-inset-top, 0px) + 20px) var(--gut-r) 14px var(--gut)}
.cover-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.label{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  background:var(--label);color:var(--ink);border:1px solid var(--cover-ink);outline:1px solid var(--cover-ink);outline-offset:2px;
  padding:10px 12px;min-height:60px}
.label:focus-visible{outline:2px solid var(--cover-ink);outline-offset:3px}
.label h1{margin:0;font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.label p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.cover-row{display:flex;align-items:center;gap:12px;min-height:28px;border-top:1px solid var(--cover-ink);padding-top:8px}
.imprint{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
@media (max-width:480px){.imp-wide{display:none}}
.pageno{font-size:11px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.dots{display:flex;gap:0}
.dots button{width:24px;height:24px;border:0;background:none;padding:0;display:grid;place-items:center}
.dots button::before{content:"";width:8px;height:8px;border:1px solid var(--cover-ink);border-radius:50%}
.dots button[aria-current="true"]::before{background:var(--cover-ink)}
.turn{width:36px;height:28px;border:1px solid var(--cover-ink);background:transparent;color:var(--cover-ink);display:none;place-items:center}
.turn:disabled{opacity:.3;cursor:default}
@media (hover:hover) and (pointer:fine){.turn{display:grid}}
.save-chip{border:1px solid var(--cover-ink);background:var(--cover-ink);color:var(--cover);font-weight:600;font-size:14px;padding:8px 12px;white-space:nowrap}

/* page body */
.sheet{max-width:1100px;margin:0 auto;padding:0 var(--gut-r) 32px var(--gut)}
@media (min-width:900px){
  .mini{height:min(600px, 68dvh);margin-inline:0;border:1px solid var(--ink)}
  .afd-sec{max-width:860px}
}
.status{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--ink-2);padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.status .warnline{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:6px 0;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;font-size:12px;color:var(--ink)}

/* alerts */
.alerts{display:grid;gap:8px;padding-top:12px}
.alert{border:1px solid var(--ink);background:var(--alert)}
.alert.sev-hi{background:var(--alert-sev);border-color:var(--warn)}
.alert-h{display:flex;gap:10px;align-items:flex-start;padding:12px}
.alert .sev{color:var(--warn)}
.alert b{display:block;font-size:15px}
.alert small{color:var(--ink-2);font-size:13px}
.alert .body{padding:0 12px 12px 42px;font-size:14px;white-space:pre-line;max-width:70ch}
.alert .body h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rule);margin:12px 0 4px}

/* trace */
.trace{padding-bottom:6px}
.readout{display:flex;flex-wrap:wrap;gap:2px 10px;min-height:44px;align-content:center;font-size:14px;border-bottom:1px solid var(--rule-soft);margin-top:6px}
.readout b{font-weight:800}
.chart{position:relative;touch-action:pan-y;cursor:crosshair;margin-top:4px}
.chart svg{display:block;width:100%;overflow:visible}
.chart:focus-visible{outline-offset:4px}
.r{stroke:var(--rule);stroke-width:1;shape-rendering:crispEdges}
.r-soft{stroke:var(--rule-soft);stroke-width:1;shape-rendering:crispEdges}
.t-ax{fill:var(--rule);font-size:10px;font-weight:500}
.t-day{fill:var(--ink);font-size:10px;font-weight:800;letter-spacing:.08em}
.pencil{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.pencil.draw{animation:draw 1.1s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.pcp{fill:var(--rule)}
.t-peak{fill:var(--ink);font-size:11px;font-weight:700}
.t-snow{fill:var(--ink);font-size:10px;font-weight:700}
.nowline{stroke:var(--now);stroke-width:1.5}
.nowdot{fill:var(--page);stroke:var(--now);stroke-width:1.8}
.cursor{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
.cdot{fill:var(--ink)}

.disc{width:12px;height:12px;fill:none;stroke:var(--rule);stroke-width:1.6;margin-left:4px;vertical-align:1px;transition:transform .25s var(--ease)}
.day-text{padding:10px 0 16px;display:grid;gap:10px;font-size:14px;max-width:68ch}
.day-text p{margin:0}
.day-text b{font-weight:600}
.day-text small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}

.sec{padding-top:30px}
.sec-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.sec-t{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15;padding:0 3px;margin-left:-3px;
  background:linear-gradient(transparent 56%, var(--hl) 56% 94%, transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sec-note{margin:0;font-size:13px;color:var(--ink-2)}
.sec-note b{color:var(--ink)}
.sec-tools{display:flex;align-items:center;gap:6px}
.step{display:none;width:36px;height:32px;border:1px solid var(--ink);background:transparent;color:var(--ink);place-items:center;padding:0}
.step:hover{background:var(--cover);color:var(--cover-ink);border-color:var(--cover-ink)}
.step:last-of-type{margin-right:10px}
@media (hover:hover) and (pointer:fine){.step{display:grid}}
.ext{font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.ext-i{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6}
.caption{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.caption b{color:var(--ink)}
.no-alerts{margin:0;padding:12px 0;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule-soft)}

/* forecast periods: a ruled strip of columns, scrolled sideways */
.pstrip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,140px);grid-template-rows:repeat(6,auto);overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;margin-top:14px;border:1px solid var(--ink);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.pstrip:focus-visible{outline-offset:3px}
.pcard{grid-row:span 6;display:grid;grid-template-rows:subgrid;justify-items:center;text-align:center;padding:14px 10px 16px;border-left:1px solid var(--rule);scroll-snap-align:start;row-gap:6px}
.pcard:first-child{border-left:0}
.pcard{background:var(--day)}
.pcard.night{background:var(--night)}
.pcard h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;text-wrap:balance;align-self:start}
.wx{width:52px;height:52px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin:4px 0}
.wx-cloud{fill:var(--label)}
.wx-cloud.storm{fill:var(--storm)}
.wx-rain{stroke:var(--lo);stroke-width:2.2}
.wx-sun{fill:var(--cover)}
.wx-moon{fill:var(--page)}
.wx-dot{stroke-width:3.2}
.wx-bolt{stroke-width:2.4}
.pshort{margin:0;font-size:13px;line-height:1.3;color:var(--ink-2);align-self:start}
.ptemp{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.ptemp.hi{color:var(--hi)}
.ptemp.lo{color:var(--lo)}
.ppop{margin:0;font-size:13px;color:var(--ink-2)}
.psnow{margin:0;font-size:13px;font-weight:700;color:var(--ink);min-height:1em}

/* current conditions */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 20px;margin:16px 0 0;padding-bottom:14px;border-bottom:1px solid var(--rule-soft)}
.stats div{min-width:0}
.stats dt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd{margin:4px 0 0;font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stats dd small{font-size:15px;font-weight:600;letter-spacing:0;color:var(--ink-2);margin-left:2px}

/* detailed forecast */
.dlist{margin:0}
.dlist div{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.dlist dt{font-weight:800;font-size:15px}
.dlist dd{margin:0;font-size:15px;line-height:1.55;max-width:68ch}
@media (min-width:720px){.dlist div{grid-template-columns:200px minmax(0,1fr);gap:24px}}

.locmap{padding-top:30px}
.ndfd{padding-top:30px}
.ndfd .seg .mt{min-height:40px;font-size:13px}
.nd-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:16px}
.nd{margin:0;min-width:0}
.nd-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px}
.nd-head b{font-size:16px;font-weight:800}
.nd-time{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.nd-time small{font-weight:500;color:var(--ink-2);font-size:13px;margin-left:6px}
.nd-frame{position:relative;display:block;aspect-ratio:1000/803;margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));border-block:1px solid var(--ink);background:var(--page-2);overflow:hidden}
.nd-frame img{display:block;width:100%;height:100%;object-fit:contain}
.nd-frame img:not([src]){visibility:hidden}
.nd.busy .nd-frame::after{content:"Loading map…";position:absolute;left:8px;top:8px;background:var(--page);border:1px solid var(--ink);padding:4px 8px;font-size:12px;color:var(--ink)}
.nd-msg{position:absolute;inset:auto 0 0 0;margin:0;padding:8px 10px;font-size:13px;background:var(--page);border-top:1px solid var(--ink);color:var(--ink)}
.nd-ctl{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:start;gap:10px;margin-top:10px}
.nd-ctl .mt{padding:0}
.nd-scrub{position:relative;touch-action:pan-y;padding-bottom:20px}
.nd-scrub input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;background:transparent;cursor:pointer}
.nd-scrub input::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
.nd-scrub input::-moz-range-track{height:1px;background:var(--ink)}
.nd-scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:30px;margin-top:-15px;background:var(--cover);border:1px solid var(--cover-ink);border-radius:0}
.nd-scrub input::-moz-range-thumb{width:18px;height:28px;background:var(--cover);border:1px solid var(--cover-ink);border-radius:0}
.nd-ticks{position:absolute;left:0;right:0;top:30px;height:34px;pointer-events:none}
.nd-ticks span{position:absolute;top:0;border-left:1px solid var(--rule);padding:8px 0 0 3px;font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--rule);white-space:nowrap}
.nd-ticks .nd-now{border-left:2px solid var(--now);height:14px;top:-6px;padding:0}
.nd-days{display:flex;margin-top:10px}
.nd-days .mt{flex:1 1 0;min-width:0;padding:0 2px;flex-direction:column;gap:0;line-height:1.15}
.nd-days .mt small{font-weight:500;font-size:11px;opacity:.8}
@media (min-width:720px){.nd-frame{margin-inline:0;border:1px solid var(--ink)}}
@media (min-width:1000px){.nd-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.radar-panel{position:absolute;z-index:500;left:10px;bottom:24px;display:flex;align-items:stretch;gap:0;background:var(--page);border:1px solid var(--ink)}
.radar-panel[hidden]{display:none}
.radar-panel .mt.sq{border:0;border-right:1px solid var(--ink);width:44px;padding:0}
.radar-info{display:grid;gap:3px;padding:6px 10px;align-content:center}
.radar-clock{font-size:13px;font-variant-numeric:tabular-nums}
.radar-clock b{font-weight:700}
.radar-clock span{color:var(--ink-2)}
.legend{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:0 8px;width:120px}
.legend i{grid-column:1/-1;height:6px;border:1px solid var(--ink);background:linear-gradient(90deg,#04e9e7,#019ff4,#02fd02,#01c501,#fdf802,#fd9500,#fd0000,#bc0000,#f800fd)}
.legend small{font-size:10px;color:var(--ink-2)}
#fullRadar .radar-panel{bottom:28px;left:max(12px, env(safe-area-inset-left, 0px))}
.mini{position:relative;height:clamp(380px, 64dvh, 600px);margin:14px calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));border-block:1px solid var(--ink);background:var(--page-2);z-index:0}
.mini.no-tiles::after{content:"Map tiles can't load here.";position:absolute;inset:auto 0 0 0;z-index:500;padding:8px 10px;font-size:13px;background:var(--page);border-top:1px solid var(--ink)}
.mini-tools{position:absolute;z-index:500;top:10px;right:10px}
.mini-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);padding-top:4px}
.afd{}
.afd-meta{font-size:13px;color:var(--ink-2);margin:8px 0 10px;max-width:68ch}
.afd-sec{border-top:1px solid var(--rule)}
.afd-sec:last-of-type{border-bottom:1px solid var(--rule)}
.afd-h{margin:0;padding:14px 0 8px}
.afd-h b{font-size:16px;font-weight:700}
.afd-h small{display:block;font-size:12px;font-weight:400;color:var(--ink-2);margin-top:2px}
.afd-body{padding:2px 0 16px;font-size:15px;line-height:1.55;max-width:68ch}
.afd-body p{margin:0 0 10px}
.afd-body ul{margin:0 0 10px;padding-left:18px}
.afd-body li{margin-bottom:6px}
.afd-body li::marker{color:var(--rule)}
.afd-issued{font-size:12px;color:var(--ink-2)}
.foot{padding-top:18px;font-size:12px;color:var(--ink-2);display:grid;gap:6px}
.foot a{color:var(--ink)}

/* states */
.skel{padding:24px 0;display:grid;gap:14px}
.skel i{display:block;height:12px;background:var(--rule-soft)}
.skel i:nth-child(1){height:72px;width:40%}
.skel i:nth-child(2){width:70%}
.skel i:nth-child(3){height:110px}
.msg{padding:28px 0;display:grid;gap:12px;max-width:52ch}
.msg h2{margin:0;font-size:19px}
.msg p{margin:0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--ink);background:transparent;font-weight:600;font-size:15px}
.btn.solid{background:var(--ink);color:var(--page)}
.btn.yellow{background:var(--cover);color:var(--cover-ink);border-color:var(--cover-ink)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* at a glance */
.glance{padding-top:18px}
.lead{margin:0;font-size:20px;line-height:1.35;font-weight:600;max-width:40ch;text-wrap:pretty}
.sunrow{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--rule-soft);display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px}
.sunrow li{display:grid;gap:1px;align-content:start}
.sunrow span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
.sunrow b{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.sunrow small{font-size:12px;color:var(--ink-2)}
.moon-i{width:18px;height:18px;flex:none}
.moon-i circle{fill:var(--page-2);stroke:var(--ink);stroke-width:1.2}
.moon-i .lit{fill:var(--cover);stroke:none}

/* period cards are buttons */
button.pcard{font:inherit;color:inherit;background:var(--day);border:0;border-left:1px solid var(--rule);cursor:pointer;transition:background .2s var(--ease)}
button.pcard.night{background:var(--night)}
button.pcard:first-child{border-left:0}
button.pcard:hover{background:color-mix(in srgb, var(--cover) 30%, var(--page))}
button.pcard:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* precipitation ahead */
.tot{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
.tot th,.tot td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--rule-soft)}
.tot thead th{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
.tot tbody th{text-align:left;font-weight:700;font-size:15px;padding-left:0}
.tot tbody th small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.tot td{font-size:20px;font-weight:800}
.tl{margin-top:14px}
.tl-band{display:flex;height:30px;border:1px solid var(--ink);overflow:hidden}
.tseg{display:flex;align-items:center;justify-content:center;min-width:0;border-left:1px solid var(--rule-soft)}
.tseg:first-child{border-left:0}
.tseg i{font-style:normal;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;background:var(--page);border:1px solid var(--rule-soft)}
.tseg.dry{background:var(--page)}
.tseg.dry i{border:0;color:var(--ink-2);font-weight:500}
.tseg.snow{background:repeating-linear-gradient(45deg,var(--rule) 0 1.5px,transparent 1.5px 6px)}
.tseg.rain{background:color-mix(in srgb, var(--lo) 35%, var(--page))}
.tseg.mix{background:repeating-linear-gradient(45deg,var(--rule) 0 1.5px,transparent 1.5px 6px),color-mix(in srgb, var(--lo) 30%, var(--page))}
.tseg.thunder{background:color-mix(in srgb, var(--hi) 30%, var(--page))}
.tseg.fog{background:repeating-linear-gradient(0deg,var(--rule-soft) 0 1px,transparent 1px 5px)}
.tl-ticks{position:relative;height:18px}
.tl-key{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.tl-key li{display:flex;align-items:center;gap:6px}
.tl-key .tseg{width:22px;height:12px;border:1px solid var(--ink);flex:none}
.tl-ticks b{position:absolute;top:3px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding-left:3px;border-left:1px solid var(--ink)}

/* normals */
.normals{margin-top:14px}
.stats.small{border:0;padding:0;margin-top:0;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.stats.small dd{font-size:24px}
.stats.small dd small{font-size:13px}

/* mountain */
.mt-line{font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.mt-block{padding:16px 0;border-bottom:1px solid var(--rule-soft)}
.mt-block h3{margin:0 0 10px;font-size:13px;font-weight:700}
.aval{display:flex;gap:14px;align-items:flex-start}
.aval p{margin:0;font-size:15px;line-height:1.5;max-width:60ch}
.aval-badge{flex:none;display:grid;justify-items:center;align-content:center;width:96px;min-height:64px;border:2px solid var(--ink);font-size:12px;font-weight:700;text-align:center;padding:6px}
.aval-badge b{font-size:24px;line-height:1}
.aval-badge.l0{background:var(--page-2)}
.aval-badge.l1{background:#50B848;color:#111}
.aval-badge.l2{background:#FFF200;color:#111}
.aval-badge.l3{background:#F7941E;color:#111}
.aval-badge.l4{background:#ED1C24;color:#111}
.aval-badge.l5{background:#231F20;color:#fff;border-color:#ED1C24}
.snowpack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:end}
@media (min-width:720px){.snowpack{grid-template-columns:minmax(0,1fr) 260px}}
.spark-bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;height:70px;align-items:end;border-bottom:1px solid var(--ink)}
.spark-bars span{display:grid;grid-template-rows:1fr auto;height:100%;align-items:end;text-align:center}
.spark-bars i{display:block;background:repeating-linear-gradient(45deg,var(--rule) 0 1.5px,transparent 1.5px 5px);border:1px solid var(--rule);border-bottom:0;min-height:1px}
.spark-bars small{font-size:10px;color:var(--ink-2);padding-top:2px}
.stations{display:grid;gap:0}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name now" "spark spark" "range range";gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
@media (min-width:720px){.st{grid-template-columns:minmax(0,1fr) 110px 180px;grid-template-areas:"name now spark" "name now range"}}
.st-name{grid-area:name}
.st-name b{display:block;font-size:15px}
.st-name small,.st-now small{font-size:12px;color:var(--ink-2);display:block}
.st-now{grid-area:now;text-align:right}
.st-now b{font-size:24px;font-weight:800}
.st-spark{grid-area:spark;width:100%;height:36px}
.st-spark polyline{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke}
.st-range{grid-area:range;display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2)}

/* hour by hour sheet */
dialog.bottom.tall{max-height:94dvh;height:94dvh;width:min(980px,100%)}
.dlg-sub{margin:2px 0 0;font-size:13px}
.dlg-tools{display:flex;gap:2px;align-items:center}
.dlg-tools .x{margin:0}
.dlg-tools .x:disabled{opacity:.3}
.mgram{position:relative;touch-action:pan-y;cursor:crosshair;margin-top:6px}
.mgram svg{display:block;width:100%}
.t-lab{fill:var(--ink);font-size:10px;font-weight:700;letter-spacing:.04em}
.t-key{fill:var(--ink-2);font-size:10px}
.dew{fill:none;stroke:var(--rule);stroke-width:1.6;stroke-dasharray:4 3}
.windl{fill:none;stroke:var(--ink);stroke-width:1.8}
.gustd{fill:var(--ink)}
.skyfill{fill:var(--rule-soft);stroke:var(--rule);stroke-width:1}
.elev{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:5 3}
.levell{fill:none;stroke:var(--rule);stroke-width:2.2}
.htwrap{overflow-x:auto;margin-top:14px}
.htable{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
.htable th,.htable td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.htable thead th{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule);position:sticky;top:0;background:var(--page)}
.htable tbody th{font-weight:600;white-space:nowrap}
.htable td small{display:block;font-size:12px;color:var(--ink-2)}
.htable .sk{min-width:120px}

/* bottom bar */
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--page);border-top:1px solid var(--ink);
  padding:8px var(--gut-r) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gut)}
.tabbar button{min-height:52px;border:1px solid var(--ink);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:background .2s var(--ease)}
.tabbar button:active{background:var(--cover);color:var(--cover-ink)}
.cover-nav{display:none}
@media (min-width:900px) and (hover:hover){
  body{grid-template-rows:1fr}
  .tabbar{display:none}
  .cover-nav{display:flex;gap:8px;flex:none}
  .cover-nav button{min-height:62px;padding:0 16px;display:flex;align-items:center;gap:8px;background:transparent;color:var(--cover-ink);border:1px solid var(--cover-ink);
    font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:background .2s var(--ease),color .2s var(--ease)}
  .cover-nav button:hover{background:var(--cover-ink);color:var(--cover)}
}

/* dialogs */
dialog{border:0;padding:0;background:var(--page);color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:var(--scrim)}
dialog.bottom{margin:auto auto 0;width:min(640px,100%);max-height:88dvh;border:1px solid var(--ink);border-bottom:0;display:none;flex-direction:column}
dialog.bottom[open]{display:flex;animation:rise .32s var(--ease)}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gut-r) 12px var(--gut);background:var(--cover);color:var(--cover-ink);border-bottom:1px solid var(--cover-ink)}
.dlg-h h2{margin:0;font-size:17px;font-weight:800}
.x{width:44px;height:44px;margin:-8px -10px -8px 0;border:0;background:none;display:grid;place-items:center;color:inherit}
.dlg-b{overflow-y:auto;padding:4px var(--gut-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gut)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--rule);padding:8px 0;min-height:60px}
.plist .num{font-size:12px;font-weight:800;color:var(--rule)}
.plist .go{border:0;background:none;text-align:left;padding:4px 0;min-height:44px}
.plist .go b{display:block;font-size:16px}
.plist .go small{color:var(--ink-2);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .go{min-width:0}
.plist .tools{display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{border-color:var(--rule-soft)}
.plist input{width:100%;min-height:44px;border:1px solid var(--ink);background:var(--label);padding:0 10px;font-size:16px}
.add{display:grid;gap:8px;padding:16px 0 4px}
.add .row-btns > *{flex:1 1 140px}
.hint{font-size:13px;color:var(--ink-2);padding-top:12px;border-top:1px solid var(--rule-soft);margin-top:12px}

.search-in{display:flex;gap:8px;padding:12px 0;position:sticky;top:0;background:var(--page)}
.search-in input{flex:1;min-width:0;min-height:48px;border:1px solid var(--ink);background:var(--label);padding:0 12px;font-size:16px}
.results{list-style:none;margin:0;padding:0}
.results button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:10px 0;min-height:56px;display:grid}
.results b{font-size:16px;font-weight:600}
.results small{color:var(--ink-2);font-size:13px}
.note{font-size:14px;color:var(--ink-2);padding:12px 0}

dialog.full{width:100%;height:100%;margin:0;border:0;display:none}
dialog.full[open]{display:grid;grid-template-rows:auto 1fr}
.map-wrap{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
#fullRadar{position:absolute;inset:0;pointer-events:none;z-index:500}
#fullRadar .radar-panel{pointer-events:auto}
#map{position:relative;min-height:0;background:var(--page-2)}
.topo-tiles{filter:grayscale(1) contrast(.82) brightness(1.08)}
:root[data-theme="dark"] .topo-tiles{filter:grayscale(1) invert(.88) contrast(.8) brightness(.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topo-tiles{filter:grayscale(1) invert(.88) contrast(.8) brightness(.9)}}
.leaflet-container img.leaflet-tile{width:256.5px!important;height:256.5px!important;max-width:none!important}
.leaflet-control-zoom a{display:grid!important;place-items:center;width:36px!important;height:36px!important}
.leaflet-control-zoom a svg{width:18px;height:18px}
.map-tools{position:absolute;z-index:500;top:12px;right:max(12px, env(safe-area-inset-right, 0px));display:grid;gap:8px}
.mt{min-width:44px;min-height:44px;border:1px solid var(--ink);background:var(--page);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13px;font-weight:600}
.mt[aria-pressed="true"]{background:var(--cover);color:var(--cover-ink);border-color:var(--cover-ink)}
.seg{display:flex}
.seg .mt + .mt{border-left:0}
.map-hint{position:absolute;z-index:500;left:calc(max(12px, env(safe-area-inset-left, 0px)) + 46px);top:10px;max-width:calc(100% - 200px);background:var(--page);border:1px solid var(--ink);padding:8px 10px;font-size:13px}
.radar-time{font-size:11px;font-weight:500;letter-spacing:0}
.pick{position:relative;z-index:600;background:var(--page);border-top:1px solid var(--ink);
  padding:14px var(--gut-r) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gut);display:grid;gap:10px;animation:rise .28s var(--ease)}
.pick b{font-size:17px}
.pick small{color:var(--ink-2);font-size:13px;display:block}
.pick .row-btns > *{flex:1 1 140px}
.pin{width:0!important;height:0!important;background:none;border:0;overflow:visible}
.stake{position:absolute;left:0;top:0;pointer-events:none}
.stake-ring{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--cover);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--page)}
.stake-ring::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink)}
.stake-pulse{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);animation:stake-pulse 2.4s var(--ease) infinite}
@keyframes stake-pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.stake-stem{position:absolute;left:-1px;bottom:12px;width:3px;height:30px;background:var(--ink)}
.stake-flag{position:absolute;left:-1px;bottom:42px;background:var(--cover);color:var(--cover-ink);border:2px solid var(--ink);font:700 13px/1 var(--font);padding:6px 9px;white-space:nowrap;pointer-events:auto}
.pin.cand .stake-ring{background:var(--page);border-style:dashed}
.pin.cand .stake-flag{background:var(--ink);color:var(--page)}
.pin.cand .stake-pulse{display:none}
.leaflet-container{font-family:var(--font);background:var(--page-2)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bar a{color:var(--ink);background:var(--page);border-radius:0!important}
.leaflet-bar{border-radius:0!important;border:1px solid var(--ink)!important;box-shadow:none!important}

.toast{position:fixed;z-index:2000;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 14px;font-size:14px;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .book{scroll-behavior:auto}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script>
(() => {
'use strict';
const NWS = 'https://api.weather.gov';
const DEFAULT_PLACES = [{ id: 'p-default', name: null, lat: 44.682, lon: -116.162 }];
const STALE_MIN = 15;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('fb.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fb.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('fb.' + k); } catch {} },
};
let places = store.get('places', null) || DEFAULT_PLACES.slice();
let preview = null; // an unsaved place being looked at
const data = new Map(); // id -> {model, source, fetchedAt, error}
let current = Math.min(store.get('index', 0), places.length - 1);
const allPages = () => (preview ? [...places, preview] : places);

/* ---------- fetching ---------- */
async function nws(url) {
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(url, { headers: { Accept: 'application/geo+json' } });
      if (r.ok) return r.json();
      last = new Error('NWS ' + r.status);
      last.status = r.status;
      if (r.status === 404 || r.status === 400) throw last;
    } catch (e) {
      last = e;
      if (e.status === 404 || e.status === 400) throw e;
      if (e instanceof TypeError && i >= 1) throw e; // blocked or offline: one quick retry is enough
    }
    await new Promise((s) => setTimeout(s, 500 * (i + 1)));
  }
  throw last;
}
const OBS_KEYS = ['timestamp', 'textDescription', 'temperature', 'windDirection', 'windSpeed', 'windGust', 'relativeHumidity', 'windChill', 'heatIndex', 'visibility'];
async function latestObs(stationsUrl) {
  const st = await nws(stationsUrl);
  for (const f of st.features.slice(0, 3)) {
    try {
      const o = (await nws(`${NWS}/stations/${f.properties.stationIdentifier}/observations/latest`)).properties;
      if (o.temperature && o.temperature.value != null && Date.now() - Date.parse(o.timestamp) < 6 * 3600e3) {
        return {
          station: { id: f.properties.stationIdentifier, name: f.properties.name, elevM: f.properties.elevation?.value ?? null, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] },
          obs: Object.fromEntries(OBS_KEYS.map((k) => [k, o[k]])),
        };
      }
    } catch {}
  }
  return null;
}
const GRID_KEYS = ['snowfallAmount', 'windGust', 'snowLevel', 'apparentTemperature', 'dewpoint', 'skyCover', 'quantitativePrecipitation', 'iceAccumulation', 'windSpeed', 'weather'];
async function fetchRaw(p) {
  const lat = p.lat.toFixed(4), lon = p.lon.toFixed(4);
  const pt = (await nws(`${NWS}/points/${lat},${lon}`)).properties;
  const [fc, hr, gr, al, afd, obsR] = await Promise.allSettled([
    nws(pt.forecast), nws(pt.forecastHourly), nws(pt.forecastGridData), nws(`${NWS}/alerts/active?point=${lat},${lon}`),
    nws(`${NWS}/products/types/AFD/locations/${pt.cwa}/latest`),
    latestObs(pt.observationStations),
  ]);
  if (fc.status !== 'fulfilled' || hr.status !== 'fulfilled') throw (fc.reason || hr.reason);
  const g = gr.status === 'fulfilled' ? gr.value.properties : {};
  return {
    fetchedAt: new Date().toISOString(),
    point: { properties: pt },
    forecast: fc.value,
    hourly: { properties: { updateTime: hr.value.properties.updateTime, periods: hr.value.properties.periods } },
    grid: { properties: Object.fromEntries(GRID_KEYS.map((k) => [k, g[k]])) },
    alerts: al.status === 'fulfilled' ? al.value : { features: [] },
    obs: obsR.status === 'fulfilled' ? obsR.value : null,
    afd: afd.status === 'fulfilled' ? { issuanceTime: afd.value.issuanceTime, productText: afd.value.productText } : null,
  };
}
let snapshotP = null;
const loadSnapshot = () => (snapshotP ||= fetch('snapshot.json').then((r) => (r.ok ? r.json() : null)).catch(() => null));

async function refresh(p, { force = false } = {}) {
  const cached = store.get('cache.' + p.id, null);
  const cur = data.get(p.id);
  if (!cur && cached) setData(p, cached, 'cache');
  const age = cached ? (Date.now() - Date.parse(cached.fetchedAt)) / 60000 : Infinity;
  if (!force && age < STALE_MIN) return;
  if (cur && cur.loading) return;
  const d = data.get(p.id) || {};
  data.set(p.id, { ...d, loading: true });
  renderStatus(p);
  try {
    const raw = await fetchRaw(p);
    if (!p.preview) store.set('cache.' + p.id, raw);
    setData(p, raw, 'live');
  } catch (err) {
    const have = data.get(p.id);
    if (have && have.model) { data.set(p.id, { ...have, loading: false, offline: true }); renderPage(p); return; }
    if (err && err.status === 404) { data.set(p.id, { error: 'outside' }); renderPage(p); return; }
    const snap = await loadSnapshot();
    if (snap && near(p, snap)) { setData(p, snap, 'snapshot'); return; }
    data.set(p.id, { error: 'network' });
    renderPage(p);
  }
}
const near = (p, snap) => Math.abs(p.lat - 44.682) < 0.02 && Math.abs(p.lon + 116.162) < 0.02 && snap;
function setData(p, raw, source) {
  let model;
  try { model = buildModel(raw, p); } catch (e) { console.error(e); data.set(p.id, { error: 'parse' }); renderPage(p); return; }
  data.set(p.id, { model, source, fetchedAt: raw.fetchedAt, loading: false });
  renderPage(p);
}

/* ---------- model ---------- */
const C2F = (c) => c * 9 / 5 + 32;
const KMH2MPH = (k) => k * 0.621371;
const M2FT = (m) => m * 3.28084;
const MM2IN = (mm) => mm / 25.4;
const COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
function distBearing(lat1, lon1, lat2, lon2) {
  const R = 3958.8, t = Math.PI / 180;
  const dLat = (lat2 - lat1) * t, dLon = (lon2 - lon1) * t;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * t) * Math.cos(lat2 * t) * Math.sin(dLon / 2) ** 2;
  const d = 2 * R * Math.asin(Math.sqrt(a));
  const y = Math.sin(dLon) * Math.cos(lat2 * t);
  const x = Math.cos(lat1 * t) * Math.sin(lat2 * t) - Math.sin(lat1 * t) * Math.cos(lat2 * t) * Math.cos(dLon);
  const b = (Math.atan2(y, x) / t + 360) % 360;
  return { d, dir: COMPASS[Math.round(b / 22.5) % 16] };
}
function parseDur(s) {
  const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(s || '');
  return m ? (+(m[1] || 0) * 24 + +(m[2] || 0) + +(m[3] || 0) / 60) * 3600e3 : 3600e3;
}
function series(layer) {
  if (!layer || !layer.values) return [];
  return layer.values.map((v) => {
    const [a, d] = v.validTime.split('/');
    const s = Date.parse(a);
    return { s, e: s + parseDur(d), v: v.value };
  });
}
const at = (ser, t) => { const x = ser.find((r) => t >= r.s && t < r.e); return x ? x.v : null; };
function sumOver(ser, a, b) {
  let tot = 0;
  for (const r of ser) {
    const o = Math.min(b, r.e) - Math.max(a, r.s);
    if (o > 0 && r.v) tot += r.v * (o / (r.e - r.s));
  }
  return tot;
}
function parseAFD(a) {
  if (!a || !a.productText) return null;
  let t = a.productText.replace(/\r/g, '');
  const office = (/National Weather Service (.+)/.exec(t) || [])[1] || '';
  t = t.split(/\n\$\$/)[0];
  const start = t.search(/^\./m);
  if (start < 0) return null;
  const sections = t.slice(start).split(/\n&&\s*\n?/).map((c) => {
    const m = /^\.([^\n]*?)\.\.\.\s*([\s\S]*)$/.exec(c.trim());
    if (!m) return null;
    let name = m[1].trim().replace(/^[A-Z]{3} (?=WATCHES)/, ''), sub = '';
    const sm = /^(.*?)\s*\/(.*)\/\s*$/.exec(name);
    if (sm) { name = sm[1]; sub = sm[2]; }
    name = name.toLowerCase().replace(/^\w/, (x) => x.toUpperCase()).replace('Watches/warnings', 'Watches and warnings');
    let body = m[2], issued = '';
    body = body.replace(/^Issued ([^\n]*)\n/i, (x, y) => { issued = y; return ''; });
    const blocks = body.split(/\n\s*\n/).map((para) => {
      const lines = para.split('\n').filter((l) => l.trim());
      if (!lines.length) return null;
      if (/^\s*[-*] /.test(lines[0])) {
        const items = [];
        for (const l of lines) { if (/^\s*[-*] /.test(l)) items.push(l.replace(/^\s*[-*] /, '').trim()); else if (items.length) items[items.length - 1] += ' ' + l.trim(); }
        return { list: items };
      }
      if (lines.every((l) => l.length < 50) && lines.length > 1) return { lines: lines.map((l) => l.trim()) };
      return { text: lines.map((l) => l.trim()).join(' ') };
    }).filter(Boolean);
    return { name, sub, issued, blocks };
  }).filter(Boolean);
  return { office, issued: Date.parse(a.issuanceTime), sections };
}
function buildModel(raw, place) {
  const pt = raw.point.properties;
  const tz = pt.timeZone || 'America/Boise';
  const fc = raw.forecast.properties;
  const hours = raw.hourly.properties.periods.map((h) => ({
    t: Date.parse(h.startTime), temp: h.temperature, pop: h.probabilityOfPrecipitation?.value ?? 0,
    wind: h.windSpeed, dir: h.windDirection, short: h.shortForecast, day: h.isDaytime, dewF: h.dewpoint && h.dewpoint.value != null ? Math.round(C2F(h.dewpoint.value)) : null,
  }));
  const g = raw.grid.properties || {};
  const snow = series(g.snowfallAmount), gust = series(g.windGust), level = series(g.snowLevel), feel = series(g.apparentTemperature);
  const wxSer = ((g.weather && g.weather.values) || []).map((v) => { const [a, du] = v.validTime.split('/'); const st = Date.parse(a); return { s: st, e: st + parseDur(du), v: v.value }; });
  const ser = { snow, gust, level, feel, wx: wxSer, dew: series(g.dewpoint), sky: series(g.skyCover), qpf: series(g.quantitativePrecipitation), ice: series(g.iceAccumulation), wspd: series(g.windSpeed) };
  const now = Date.now();
  let i0 = hours.findIndex((h) => h.t + 3600e3 > now);
  if (i0 < 0) i0 = 0;
  const h24 = hours.slice(i0, i0 + 25);
  const elevFt = fc.elevation?.value != null ? M2FT(fc.elevation.value) : null;
  const rl = pt.relativeLocation?.properties;
  const rlc = pt.relativeLocation?.geometry?.coordinates;
  let near = '';
  if (rl && rlc) {
    const { d, dir } = distBearing(rlc[1], rlc[0], place.lat, place.lon);
    near = d < 1 ? `${rl.city}, ${rl.state}` : `${Math.round(d)} mi ${dir} of ${rl.city}, ${rl.state}`;
  }
  // pair periods into days
  const days = [];
  for (const p of fc.periods) {
    const last = days[days.length - 1];
    if (!p.isDaytime && last && last.day && !last.night) last.night = p;
    else days.push(p.isDaytime ? { day: p, night: null } : { day: null, night: p });
  }
  const fmt = (t, o) => new Intl.DateTimeFormat('en-US', { timeZone: tz, ...o }).format(t);
  const week = days.slice(0, 7).map((d, i) => {
    const first = d.day || d.night;
    const start = Date.parse(first.startTime);
    const end = Date.parse((d.night || d.day).endTime);
    const wd = fmt(start, { weekday: 'short' });
    const long = fmt(start, { weekday: 'long' });
    const tag = first.name.replace(/ Night$/, '');
    const special = !['Today', 'Tonight', 'This Afternoon', 'Overnight', long].includes(tag) ? tag.replace(/ Day$/, '') : '';
    const pops = [d.day, d.night].filter(Boolean).map((p) => p.probabilityOfPrecipitation?.value ?? 0);
    return {
      label: i === 0 ? (d.day ? 'Today' : 'Tonight') : wd,
      sub: special || fmt(start, { month: 'short', day: 'numeric' }),
      short: (d.day || d.night).shortForecast,
      hi: d.day ? d.day.temperature : null, lo: d.night ? d.night.temperature : null,
      pop: Math.max(...pops), snowIn: snow.length ? MM2IN(sumOver(snow, start, end)) : null,
      periods: [d.day, d.night].filter(Boolean),
    };
  });
  const h0 = h24[0] || hours[0];
  const tNow = Math.max(now, h0.t);
  const gustNow = at(gust, tNow), feelNow = at(feel, tNow), levelNow = at(level, tNow);
  const snow24 = snow.length ? MM2IN(sumOver(snow, h0.t, h0.t + 24 * 3600e3)) : null;

/* ---------- radar: the last 50 minutes of NWS NEXRAD, looped ---------- */
const RADAR_URL = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';
const RADAR_AGO = [50, 40, 30, 20, 10, 0];
let radarValidP = null;

  .then((r) => r.json()).then((j) => Date.parse(j.meta.valid)).catch(() => null));
function radarLoop(map, ui) {

    `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913${m ? '-m' + String(m).padStart(2, '0') + 'm' : ''}/{z}/{x}/{y}.png?t=${bucket}`,
    { opacity: 0, zIndex: 5, className: 'radar-tiles', attribution: m ? '' : 'Radar: NWS via IEM' }));
  let i = layers.length - 1, timer = null, on = false, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, base = null;
  const label = () => {
    if (!ui.time) return;
    const ago = RADAR_AGO[i];
    ui.time.textContent = base ? new Date(base - ago * 60000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    if (ui.ago) ui.ago.textContent = ago ? `${ago} min ago` : 'latest';
    ui.time.dataset.latest = ago === 0;
  };
  const show = (k) => { layers[i].setOpacity(0); i = k; layers[i].setOpacity(0.85); label(); };
  const tick = () => { show((i + 1) % layers.length); timer = setTimeout(tick, i === layers.length - 1 ? 1600 : 650); };
  const api = {
    get on() { return on; },
    start() {
      if (on) return; on = true;
      layers.forEach((l) => l.addTo(map)); show(layers.length - 1);
      radarValid().then((t) => { base = t; label(); });
      if (playing) timer = setTimeout(tick, 1200);
      ui.panel && (ui.panel.hidden = false);
      api.sync();
    },
    stop() { on = false; clearTimeout(timer); layers.forEach((l) => map.removeLayer(l)); ui.panel && (ui.panel.hidden = true); api.sync(); },
    toggle() { on ? api.stop() : api.start(); },
    play(v) { playing = v; clearTimeout(timer); if (v && on) timer = setTimeout(tick, 300); else if (on) show(layers.length - 1); api.sync(); },
    sync() {
      ui.btn && ui.btn.setAttribute('aria-pressed', on);
      if (ui.play) { ui.play.setAttribute('aria-pressed', playing); ui.play.setAttribute('aria-label', playing ? 'Pause radar loop' : 'Play radar loop'); ui.play.innerHTML = playing ? ICON.pause : ICON.play; }
    },

  ui.btn && (ui.btn.onclick = () => api.toggle());

}

  <div class="radar-info"><span class="radar-clock"><b data-radar-time></b> <span data-radar-ago>latest</span></span><span class="legend" aria-label="Radar intensity, light to heavy"><i></i><small>Light</small><small>Heavy</small></span></div></div>`;

/* ---------- derived: totals, precip type, summary, sun & moon ---------- */
const WX_SEVER = { slight_chance: 1, isolated: 1, patchy: 1, chance: 2, scattered: 2, areas: 2, likely: 3, numerous: 3, occasional: 3, periods: 3, definite: 4, widespread: 4 };
function wxType(vals) {
  const w = (vals || []).filter((v) => v && v.weather).map((v) => v.weather);
  if (!w.length) return null;
  if (w.some((x) => /thunder/.test(x))) return 'thunder';
  const sn = w.some((x) => /snow|sleet|ice_pellets/.test(x)), rn = w.some((x) => /rain|drizzle/.test(x)), fz = w.some((x) => /freezing/.test(x));
  if (fz || (sn && rn)) return 'mix';
  if (sn) return 'snow';
  if (rn) return 'rain';
  if (w.some((x) => /fog|haze|smoke/.test(x))) return 'fog';
  return null;
}
const wxAt = (m, t) => { const x = m.ser.wx.find((r) => t >= r.s && t < r.e); return x ? x.v : null; };

function totals(m) {
  const t0 = m.hours[0].t;
  return [24, 48, 72].map((h) => {
    const b = t0 + h * 3600e3;
    return { h, snow: MM2IN(sumOver(m.ser.snow, t0, b)), liquid: MM2IN(sumOver(m.ser.qpf, t0, b)), ice: MM2IN(sumOver(m.ser.ice, t0, b)) };
  });
}
function typeTimeline(m, hrs = 72) {
  const t0 = m.hours[0].t, t1 = t0 + hrs * 3600e3, segs = [];
  for (let t = t0; t < t1; t += 3600e3) {
    const ty = wxType(wxAt(m, t)) || 'dry';
    const last = segs[segs.length - 1];
    if (last && last.type === ty) last.e = t + 3600e3; else segs.push({ type: ty, s: t, e: t + 3600e3 });
  }

}
function whenWords(m, t) {
  const t0 = m.hours[0].t;
  const day = (x) => m.fmt(x, { year: 'numeric', month: '2-digit', day: '2-digit' });
  const hr = +m.fmt(t, { hour: 'numeric', hourCycle: 'h23' });
  const part = hr < 5 ? 'overnight' : hr < 9 ? 'early morning' : hr < 12 ? 'late morning' : hr < 15 ? 'early afternoon' : hr < 18 ? 'late afternoon' : hr < 21 ? 'evening' : 'late evening';
  if (day(t) === day(t0)) return hr >= 18 ? 'tonight' : `this ${part.replace(/^(early|late) /, '')}`;
  if (day(t) === day(t0 + 864e5)) return hr < 5 ? 'late tonight' : `tomorrow ${part}`;
  return `${m.fmt(t, { weekday: 'long' })} ${part}`;
}
function summary(m) {

  const wet = H.find((h) => h.pop >= 50) || H.find((h) => h.pop >= 30);
  const tot = totals(m)[2];
  if (!wet) parts.push('Dry for the next three days.');
  else {
    const ty = wxType(wxAt(m, wet.t)) || (/snow/i.test(wet.short) ? 'snow' : /rain|shower/i.test(wet.short) ? 'rain' : null);
    const name = ty ? TYPE_NAME[ty] : 'Precipitation';
    const peak = Math.max(...H.filter((h) => h.t >= wet.t && h.t < wet.t + 12 * 3600e3).map((h) => h.pop));
    const odds = peak >= 60 ? 'likely' : 'possible';
    let s = wet.t - t0 < 2 * 3600e3 ? `${name} ${odds} now` : `${name} ${odds} from ${whenWords(m, wet.t)}`;
    if (tot.snow >= 1.5) {
      const lastSnow = [...m.ser.snow].reverse().find((r) => r.s < end && r.v > 0.5);
      s += `, with about ${Math.round(tot.snow)} in of snow by ${lastSnow ? m.fmt(Math.min(lastSnow.e, end) - 1, { weekday: 'long' }) : 'the weekend'}`;
    } else if (tot.snow >= 0.5) s += ', with about an inch of snow';

  if (gm >= 30) parts.push(`Gusts to ${gm} mph ${whenWords(m, gt)}.`);
  const highs = m.periods.filter((q) => q.isDay).slice(0, 2);
  if (highs.length === 2 && Math.abs(highs[1].temp - highs[0].temp) >= 8) parts.push(`${highs[1].temp > highs[0].temp ? 'Warmer' : 'Colder'} ${highs[1].name === 'Tomorrow' ? 'tomorrow' : 'on ' + highs[1].name.replace(/ Day$/, '')}, with a high of ${highs[1].temp}°.`);

  }).join('');
  body.innerHTML = `<div class="readout" id="hReadout"></div><div class="mgram" id="mgram" tabindex="0" role="img" aria-label="Hour by hour charts. Use arrow keys to read each hour."></div>
    <div class="htwrap"><table class="htable"><thead><tr><th scope="col">Hour</th><th scope="col">Temp</th><th scope="col">Sky</th><th scope="col">Precip</th><th scope="col">Wind</th><th scope="col">Clouds</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="caption">${esc(q.name)}: ${esc(q.detailed)}</p>`;
  drawMeteogram($('#mgram'), $('#hReadout'), m, H);
}
function drawMeteogram(box, ro, m, H) {
  const n = H.length, W = Math.max(300, Math.round(box.clientWidth || 600)), L = 46, R = 8;
  const x = (i) => L + (i * (W - L - R)) / Math.max(1, n - 1), px = (v) => Math.round(v) + 0.5;
  const temps = H.map((h) => h.temp), dews = H.map((h) => h.dewF).filter((v) => v != null);
  const vals = [...temps, ...dews], tmn = Math.min(...vals), tmx = Math.max(...vals);
  const tlo = Math.floor((tmn - 2) / 5) * 5, thi = Math.ceil((tmx + 2) / 5) * 5;
  const winds = H.map((h) => at(m.ser.wspd, h.t)).map((v) => (v == null ? null : KMH2MPH(v)));
  const gusts = H.map((h) => at(m.ser.gust, h.t)).map((v) => (v == null ? null : KMH2MPH(v)));
  const wmax = Math.max(10, ...winds.filter((v) => v != null), ...gusts.filter((v) => v != null));
  const whi = Math.ceil(wmax / 10) * 10;
  const levels = H.map((h) => at(m.ser.level, h.t)).map((v) => (v == null ? null : M2FT(v)));
  const hasLevel = levels.some((v) => v != null) && m.elevFt != null;
  const panels = [
    { key: 't', label: 'Temperature °F', h: 110 }, { key: 'p', label: 'Precipitation chance and snow', h: 58 }, { key: 'w', label: 'Wind mph', h: 64 }, { key: 'c', label: 'Cloud cover', h: 30 },
    ...(hasLevel ? [{ key: 's', label: 'Snow level vs this spot', h: 64 }] : []),
  ];
  let y = 30;
  panels.forEach((pn) => { pn.y = y; y += pn.h + 26; });
  const HT = y + 4;
  const hid = 'mh' + Math.random().toString(36).slice(2, 7);
  let s = `<svg viewBox="0 0 ${W} ${HT}" height="${HT}" aria-hidden="true"><defs><pattern id="${hid}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="var(--rule)" stroke-width="1.2" opacity=".6"/></pattern></defs>`;
  H.forEach((h, i) => {
    const hr = +m.fmt(h.t, { hour: 'numeric', hourCycle: 'h23' });
    if (hr === 0 && i > 0) s += `<path class="r" d="M${px(x(i))} 14V${HT - 18}"/><text class="t-day" x="${x(i) + 4}" y="10">${m.fmt(h.t, { weekday: 'short' }).toUpperCase()}</text>`;
    if (hr % 3 === 0) s += `<text class="t-ax" x="${x(i)}" y="${HT - 4}" text-anchor="middle">${hr === 0 ? '12a' : hr === 12 ? '12p' : hr > 12 ? hr - 12 + 'p' : hr + 'a'}</text>`;
  });
  for (const pn of panels) {
    const top = pn.y, bot = pn.y + pn.h;
    s += `<path class="r" d="M${L} ${px(bot)}H${W - R}"/><text class="t-lab" x="${L}" y="${top - 6}">${pn.label}</text>`;
    if (pn.key === 't') {
      const Y = (v) => bot - ((v - tlo) / (thi - tlo)) * pn.h;
      for (let v = tlo; v <= thi; v += 5) if ((v - tlo) % 10 === 0) s += `<path class="r-soft" d="M${L} ${px(Y(v))}H${W - R}"/><text class="t-ax" x="${L - 5}" y="${Y(v) + 3.5}" text-anchor="end">${v}°</text>`;
      const dp = H.map((h, i) => (h.dewF == null ? null : `${x(i).toFixed(1)},${Y(h.dewF).toFixed(1)}`)).filter(Boolean).join(' ');
      if (dp) s += `<polyline class="dew" points="${dp}"/>`;
      s += `<polyline class="pencil" points="${H.map((h, i) => `${x(i).toFixed(1)},${Y(h.temp).toFixed(1)}`).join(' ')}"/>`;
      s += `<text class="t-key" x="${W - R}" y="${top - 6}" text-anchor="end">— temp  ┄ dew point</text>`;
      pn.Y = Y;
    }
    if (pn.key === 'p') {
      const bw = Math.max(3, ((W - L - R) / Math.max(1, n - 1)) * 0.6);
      for (const b of m.ser.snow) {
        const i0 = Math.max(0, (b.s - H[0].t) / 3600e3), i1 = Math.min(n - 1, (b.e - H[0].t) / 3600e3);
        if (i1 <= i0 || !b.v || MM2IN(b.v) < 0.05) continue;
        s += `<rect x="${x(i0)}" y="${top}" width="${x(i1) - x(i0)}" height="${pn.h}" fill="url(#${hid})"/><text class="t-snow" x="${(x(i0) + x(i1)) / 2}" y="${top + 11}" text-anchor="middle">${MM2IN(b.v).toFixed(1)}″ snow</text>`;
      }
      H.forEach((h, i) => { if (h.pop > 0) { const bh = (h.pop / 100) * (pn.h - 14); s += `<rect class="pcp" x="${Math.min(W - R - bw, Math.max(L, x(i) - bw / 2))}" y="${bot - bh}" width="${bw}" height="${bh}"/>`; } });
      s += `<text class="t-ax" x="${L - 5}" y="${top + 17}" text-anchor="end">100%</text><text class="t-ax" x="${L - 5}" y="${bot}" text-anchor="end">0</text>`;
    }
    if (pn.key === 'w') {
      const Y = (v) => bot - (v / whi) * pn.h;
      s += `<path class="r-soft" d="M${L} ${px(Y(whi / 2))}H${W - R}"/><text class="t-ax" x="${L - 5}" y="${Y(whi) + 9}" text-anchor="end">${whi}</text><text class="t-ax" x="${L - 5}" y="${Y(whi / 2) + 3.5}" text-anchor="end">${whi / 2}</text>`;
      const wp = winds.map((v, i) => (v == null ? null : `${x(i).toFixed(1)},${Y(v).toFixed(1)}`)).filter(Boolean).join(' ');
      if (wp) s += `<polyline class="windl" points="${wp}"/>`;
      gusts.forEach((g, i) => { if (g != null) s += `<circle class="gustd" cx="${x(i)}" cy="${Y(g)}" r="2.2"/>`; });
      s += `<text class="t-key" x="${W - R}" y="${top - 6}" text-anchor="end">— speed  · gusts</text>`;
    }
    if (pn.key === 'c') {
      const pts = H.map((h, i) => { const v = at(m.ser.sky, h.t); return `${x(i).toFixed(1)},${(bot - ((v ?? 0) / 100) * pn.h).toFixed(1)}`; });
      s += `<polygon class="skyfill" points="${x(0)},${bot} ${pts.join(' ')} ${x(n - 1)},${bot}"/>`;
    }
    if (pn.key === 's') {
      const lv = levels.filter((v) => v != null), lo = Math.min(m.elevFt, ...lv), hi = Math.max(m.elevFt, ...lv);
      const a = Math.floor((lo - 300) / 1000) * 1000, b = Math.ceil((hi + 300) / 1000) * 1000;
      const Y = (v) => bot - ((v - a) / (b - a)) * pn.h;
      s += `<text class="t-ax" x="${L - 5}" y="${Y(b) + 9}" text-anchor="end">${(b / 1000).toFixed(0)}k</text><text class="t-ax" x="${L - 5}" y="${bot}" text-anchor="end">${(a / 1000).toFixed(0)}k</text>`;
      s += `<path class="elev" d="M${L} ${Y(m.elevFt)}H${W - R}"/><text class="t-key" x="${W - R}" y="${Y(m.elevFt) - 4}" text-anchor="end">this spot ${Math.round(m.elevFt).toLocaleString()} ft</text>`;
      const lp = levels.map((v, i) => (v == null ? null : `${x(i).toFixed(1)},${Y(v).toFixed(1)}`)).filter(Boolean).join(' ');
      s += `<polyline class="levell" points="${lp}"/>`;
    }
  }
  s += `<g class="cur" visibility="hidden"><path class="cursor" d="M0 4V${HT - 18}"/><circle class="cdot" r="3.5"/></g></svg>`;
  box.innerHTML = s;
  const tp = panels[0];
  const read = (i) => {
    const h = H[i], g = gusts[i], lv = levels[i], sk = at(m.ser.sky, h.t);
    ro.innerHTML = `<b>${esc(m.fmt(h.t, { weekday: 'short', hour: 'numeric' }))}</b><span><b>${h.temp}°</b>${h.dewF != null ? ` dew ${Math.round(h.dewF)}°` : ''}</span><span>${esc(h.short)}</span><span>${h.pop}% precip</span><span>${esc(h.dir)} ${esc(h.wind)}${g != null && g >= 15 ? `, gusts ${Math.round(g)}` : ''}</span>${sk != null ? `<span>${Math.round(sk)}% clouds</span>` : ''}${lv != null ? `<span>snow level ${(Math.round(lv / 100) * 100).toLocaleString()} ft</span>` : ''}`;
    const c = box.querySelector('.cur'); c.setAttribute('visibility', 'visible');
    c.querySelector('.cursor').setAttribute('transform', `translate(${x(i)} 0)`);
    const dot = c.querySelector('.cdot'); dot.setAttribute('cx', x(i)); dot.setAttribute('cy', tp.Y(h.temp));
  };
  let idx = 0; read(0);
  const pick = (ev) => { const r = box.getBoundingClientRect(); idx = Math.max(0, Math.min(n - 1, Math.round((((ev.clientX - r.left) / r.width) * W - L) / ((W - L - R) / Math.max(1, n - 1))))); read(idx); };
  box.onpointermove = pick; box.onpointerdown = pick;
  box.onkeydown = (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); idx = Math.max(0, Math.min(n - 1, idx + (e.key === 'ArrowRight' ? 1 : -1))); read(idx); } };
}
$('#hPrev').onclick = () => { if (hoursState && hoursState.idx > 0) { hoursState.idx--; renderHours(); } };
$('#hNext').onclick = () => { if (hoursState && hoursState.idx < hoursState.m.periods.length - 1) { hoursState.idx++; renderHours(); } };


/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { const p = allPages()[current]; if (p) refresh(p); } });
window.addEventListener('online', () => { const p = allPages()[current]; if (p) refresh(p, { force: true }); });
setInterval(() => { allPages().forEach((p) => { const d = data.get(p.id); if (d && d.model) renderStatus(p); }); }, 60000);

buildBook();
setTimeout(() => { goTo(current, false); setCurrent(current); places.forEach((p) => refresh(p)); }, 0);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
