<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PWA-HEAD-->
<title>Field Book Forecast</title>
<meta name="description" content="National Weather Service point forecasts for your saved places, set out like a field book.">
<meta name="theme-color" content="#E9B300">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Book">
<link rel="stylesheet" href="vendor/leaflet.css">
<!--/PWA-HEAD-->
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Public Sans";font-style:normal;font-weight:400 800;font-display:swap;src:url("vendor/public-sans-latin.woff2") format("woff2")}
:root{
  --cover:#E9B300; --cover-ink:#22262A; --label:#FFFFFF;
  --page:#F4F7F1; --page-2:#E8EEE6;
  --ink:#22262A; --ink-2:#3E5246; --rule:#2F6B4F; --rule-soft:rgba(47,107,79,.28);
  --now:#C2410C; --warn:#A61B1B; --scrim:rgba(20,24,26,.48);
  --hi:#B93E0A; --lo:#1D5AA6;
  --font:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cover:#D19E0B; --cover-ink:#121517; --label:#1B2023;
    --page:#121517; --page-2:#1B2023;
    --ink:#E4EAE3; --ink-2:#AFC2B5; --rule:#6FA88A; --rule-soft:rgba(111,168,138,.28);
    --now:#F07A3A; --warn:#FF8A80; --scrim:rgba(0,0,0,.6); --hi:#FF8F52; --lo:#7DB3FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cover:#D19E0B; --cover-ink:#121517; --label:#1B2023;
  --page:#121517; --page-2:#1B2023;
  --ink:#E4EAE3; --ink-2:#AFC2B5; --rule:#6FA88A; --rule-soft:rgba(111,168,138,.28);
  --now:#F07A3A; --warn:#FF8A80; --scrim:rgba(0,0,0,.6); --hi:#FF8F52; --lo:#7DB3FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overflow:hidden;
  display:grid;grid-template-rows:1fr auto;}
::selection{background:var(--cover);color:var(--cover-ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--rule)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* book: one page per place, a hard snap apart */
.book{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;min-height:0}
.book::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-align:start;scroll-snap-stop:always;scrollbar-color:var(--rule-soft) transparent}

/* cover band */
.cover{background:var(--cover);color:var(--cover-ink);border-bottom:1px solid var(--cover-ink);
  padding:calc(env(safe-area-inset-top, 0px) + 20px) var(--gut-r) 14px var(--gut)}
.cover-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.label{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  background:var(--label);color:var(--ink);border:1px solid var(--cover-ink);outline:1px solid var(--cover-ink);outline-offset:2px;
  padding:10px 12px;min-height:60px}
.label:focus-visible{outline:2px solid var(--cover-ink);outline-offset:3px}
.label h1{margin:0;font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.label p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.cover-row{display:flex;align-items:center;gap:12px;min-height:28px;border-top:1px solid var(--cover-ink);padding-top:8px}
.imprint{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
@media (max-width:480px){.imp-wide{display:none}}
.pageno{font-size:11px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.dots{display:flex;gap:0}
.dots button{width:24px;height:24px;border:0;background:none;padding:0;display:grid;place-items:center}
.dots button::before{content:"";width:8px;height:8px;border:1px solid var(--cover-ink);border-radius:50%}
.dots button[aria-current="true"]::before{background:var(--cover-ink)}
.turn{width:36px;height:28px;border:1px solid var(--cover-ink);background:transparent;color:var(--cover-ink);display:none;place-items:center}
.turn:disabled{opacity:.3;cursor:default}
@media (hover:hover) and (pointer:fine){.turn{display:grid}}
.save-chip{border:1px solid var(--cover-ink);background:var(--cover-ink);color:var(--cover);font-weight:600;font-size:14px;padding:8px 12px;white-space:nowrap}

/* page body */
.sheet{max-width:1100px;margin:0 auto;padding:0 var(--gut-r) 32px var(--gut)}
@media (min-width:900px){
  .mini{height:min(600px, 68dvh);margin-inline:0;border:1px solid var(--ink)}
  .afd-sec{max-width:860px}
}
.status{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--ink-2);padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.status .warnline{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:6px 0;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;font-size:12px;color:var(--ink)}

/* alerts */
.alerts{display:grid;gap:8px;padding-top:12px}
.alert{border:1px solid var(--ink);background:var(--page-2)}
.alert summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:12px;cursor:pointer}
.alert summary::-webkit-details-marker{display:none}
.alert .sev{color:var(--warn)}
.alert b{display:block;font-size:15px}
.alert small{color:var(--ink-2);font-size:13px}
.alert .body{padding:0 12px 12px 42px;font-size:14px;white-space:pre-line;max-width:70ch}
.alert .body h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rule);margin:12px 0 4px}

/* trace */
.trace{padding-bottom:6px}
.readout{display:flex;flex-wrap:wrap;gap:2px 10px;min-height:44px;align-content:center;font-size:14px;border-bottom:1px solid var(--rule-soft);margin-top:6px}
.readout b{font-weight:800}
.chart{position:relative;touch-action:pan-y;cursor:crosshair;margin-top:4px}
.chart svg{display:block;width:100%;overflow:visible}
.chart:focus-visible{outline-offset:4px}
.r{stroke:var(--rule);stroke-width:1;shape-rendering:crispEdges}
.r-soft{stroke:var(--rule-soft);stroke-width:1;shape-rendering:crispEdges}
.t-ax{fill:var(--rule);font-size:10px;font-weight:500}
.t-day{fill:var(--ink);font-size:10px;font-weight:800;letter-spacing:.08em}
.pencil{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.pencil.draw{animation:draw 1.1s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.pcp{fill:var(--rule)}
.t-peak{fill:var(--ink);font-size:11px;font-weight:700}
.t-snow{fill:var(--ink);font-size:10px;font-weight:700}
.nowline{stroke:var(--now);stroke-width:1.5}
.nowdot{fill:var(--page);stroke:var(--now);stroke-width:1.8}
.cursor{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
.cdot{fill:var(--ink)}

.disc{width:12px;height:12px;fill:none;stroke:var(--rule);stroke-width:1.6;margin-left:4px;vertical-align:1px;transition:transform .25s var(--ease)}
.day-text{padding:10px 0 16px;display:grid;gap:10px;font-size:14px;max-width:68ch}
.day-text p{margin:0}
.day-text b{font-weight:600}
.day-text small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}

.sec{padding-top:30px}
.sec-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.sec-t{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sec-note{margin:0;font-size:13px;color:var(--ink-2)}
.sec-note b{color:var(--ink)}
.sec-tools{display:flex;align-items:center;gap:6px}
.step{display:none;width:36px;height:32px;border:1px solid var(--ink);background:transparent;color:var(--ink);place-items:center;padding:0}
.step:hover{background:var(--cover);color:var(--cover-ink);border-color:var(--cover-ink)}
.step:last-of-type{margin-right:10px}
@media (hover:hover) and (pointer:fine){.step{display:grid}}
.ext{font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.ext-i{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6}
.caption{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.caption b{color:var(--ink)}
.no-alerts{margin:0;padding:12px 0;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule-soft)}

/* forecast periods: a ruled strip of columns, scrolled sideways */
.pstrip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,140px);grid-template-rows:repeat(6,auto);overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;margin-top:14px;border:1px solid var(--ink);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.pstrip:focus-visible{outline-offset:3px}
.pcard{grid-row:span 6;display:grid;grid-template-rows:subgrid;justify-items:center;text-align:center;padding:14px 10px 16px;border-left:1px solid var(--rule);scroll-snap-align:start;row-gap:6px}
.pcard:first-child{border-left:0}
.pcard.night{background:var(--page-2)}
.pcard h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;text-wrap:balance;align-self:start}
.wx{width:52px;height:52px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin:4px 0}
.wx-cloud{fill:var(--label)}
.wx-sun{fill:var(--cover)}
.wx-moon{fill:var(--page)}
.wx-dot{stroke-width:3.2}
.wx-bolt{stroke-width:2.4}
.pshort{margin:0;font-size:13px;line-height:1.3;color:var(--ink-2);align-self:start}
.ptemp{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.ptemp.hi{color:var(--hi)}
.ptemp.lo{color:var(--lo)}
.ppop{margin:0;font-size:13px;color:var(--ink-2)}
.psnow{margin:0;font-size:13px;font-weight:700;color:var(--ink);min-height:1em}

/* current conditions */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 20px;margin:16px 0 0;padding-bottom:14px;border-bottom:1px solid var(--rule-soft)}
.stats div{min-width:0}
.stats dt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd{margin:4px 0 0;font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stats dd small{font-size:15px;font-weight:600;letter-spacing:0;color:var(--ink-2);margin-left:2px}

/* detailed forecast */
.dlist{margin:0}
.dlist div{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.dlist dt{font-weight:800;font-size:15px}
.dlist dd{margin:0;font-size:15px;line-height:1.55;max-width:68ch}
@media (min-width:720px){.dlist div{grid-template-columns:200px minmax(0,1fr);gap:24px}}

.locmap{padding-top:30px}
.radar-panel{position:absolute;z-index:500;left:10px;bottom:24px;display:flex;align-items:stretch;gap:0;background:var(--page);border:1px solid var(--ink)}
.radar-panel[hidden]{display:none}
.radar-panel .mt.sq{border:0;border-right:1px solid var(--ink);width:44px;padding:0}
.radar-info{display:grid;gap:3px;padding:6px 10px;align-content:center}
.radar-clock{font-size:13px;font-variant-numeric:tabular-nums}
.radar-clock b{font-weight:700}
.radar-clock span{color:var(--ink-2)}
.legend{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:0 8px;width:120px}
.legend i{grid-column:1/-1;height:6px;border:1px solid var(--ink);background:linear-gradient(90deg,#04e9e7,#019ff4,#02fd02,#01c501,#fdf802,#fd9500,#fd0000,#bc0000,#f800fd)}
.legend small{font-size:10px;color:var(--ink-2)}
#fullRadar .radar-panel{bottom:28px;left:max(12px, env(safe-area-inset-left, 0px))}
.mini{position:relative;height:clamp(380px, 64dvh, 600px);margin:14px calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));border-block:1px solid var(--ink);background:var(--page-2);z-index:0}
.mini.no-tiles::after{content:"Map tiles can't load here.";position:absolute;inset:auto 0 0 0;z-index:500;padding:8px 10px;font-size:13px;background:var(--page);border-top:1px solid var(--ink)}
.mini-tools{position:absolute;z-index:500;top:10px;right:10px}
.mini-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);padding-top:4px}
.afd{}
.afd-meta{font-size:13px;color:var(--ink-2);margin:8px 0 10px;max-width:68ch}
.afd-sec{border-top:1px solid var(--rule)}
.afd-sec:last-of-type{border-bottom:1px solid var(--rule)}
.afd-sec summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:8px 0}
.afd-sec summary::-webkit-details-marker{display:none}
.afd-sec summary b{font-size:16px;font-weight:600}
.afd-sec summary small{display:block;font-size:12px;color:var(--ink-2)}
.afd-sec[open] .disc{transform:rotate(180deg)}
.afd-body{padding:2px 0 16px;font-size:15px;line-height:1.55;max-width:68ch}
.afd-body p{margin:0 0 10px}
.afd-body ul{margin:0 0 10px;padding-left:18px}
.afd-body li{margin-bottom:6px}
.afd-body li::marker{color:var(--rule)}
.afd-issued{font-size:12px;color:var(--ink-2)}
.foot{padding-top:18px;font-size:12px;color:var(--ink-2);display:grid;gap:6px}
.foot a{color:var(--ink)}

/* states */
.skel{padding:24px 0;display:grid;gap:14px}
.skel i{display:block;height:12px;background:var(--rule-soft)}
.skel i:nth-child(1){height:72px;width:40%}
.skel i:nth-child(2){width:70%}
.skel i:nth-child(3){height:110px}
.msg{padding:28px 0;display:grid;gap:12px;max-width:52ch}
.msg h2{margin:0;font-size:19px}
.msg p{margin:0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--ink);background:transparent;font-weight:600;font-size:15px}
.btn.solid{background:var(--ink);color:var(--page)}
.btn.yellow{background:var(--cover);color:var(--cover-ink);border-color:var(--cover-ink)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* at a glance */
.glance{padding-top:18px}
.lead{margin:0;font-size:20px;line-height:1.35;font-weight:600;max-width:40ch;text-wrap:pretty}
.sunrow{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--rule-soft);display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px}
.sunrow li{display:grid;gap:1px;align-content:start}
.sunrow span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
.sunrow b{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.sunrow small{font-size:12px;color:var(--ink-2)}
.moon-i{width:18px;height:18px;flex:none}
.moon-i circle{fill:var(--page-2);stroke:var(--ink);stroke-width:1.2}
.moon-i .lit{fill:var(--cover);stroke:none}

/* period cards are buttons */
button.pcard{font:inherit;color:inherit;background:transparent;border:0;border-left:1px solid var(--rule);cursor:pointer;transition:background .2s var(--ease)}
button.pcard.night{background:var(--page-2)}
button.pcard:first-child{border-left:0}
button.pcard:hover{background:color-mix(in srgb, var(--cover) 22%, var(--page))}
button.pcard:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* precipitation ahead */
.tot{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
.tot th,.tot td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--rule-soft)}
.tot thead th{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
.tot tbody th{text-align:left;font-weight:700;font-size:15px;padding-left:0}
.tot tbody th small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.tot td{font-size:20px;font-weight:800}
.tl{margin-top:14px}
.tl-band{display:flex;height:30px;border:1px solid var(--ink);overflow:hidden}
.tseg{display:flex;align-items:center;justify-content:center;min-width:0;border-left:1px solid var(--rule-soft)}
.tseg:first-child{border-left:0}
.tseg i{font-style:normal;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;background:var(--page);border:1px solid var(--rule-soft)}
.tseg.dry{background:var(--page)}
.tseg.dry i{border:0;color:var(--ink-2);font-weight:500}
.tseg.snow{background:repeating-linear-gradient(45deg,var(--rule) 0 1.5px,transparent 1.5px 6px)}
.tseg.rain{background:color-mix(in srgb, var(--lo) 35%, var(--page))}
.tseg.mix{background:repeating-linear-gradient(45deg,var(--rule) 0 1.5px,transparent 1.5px 6px),color-mix(in srgb, var(--lo) 30%, var(--page))}
.tseg.thunder{background:color-mix(in srgb, var(--hi) 30%, var(--page))}
.tseg.fog{background:repeating-linear-gradient(0deg,var(--rule-soft) 0 1px,transparent 1px 5px)}
.tl-ticks{position:relative;height:18px}
.tl-key{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.tl-key li{display:flex;align-items:center;gap:6px}
.tl-key .tseg{width:22px;height:12px;border:1px solid var(--ink);flex:none}
.tl-ticks b{position:absolute;top:3px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding-left:3px;border-left:1px solid var(--ink)}

/* normals */
.normals{margin-top:14px}
.stats.small{border:0;padding:0;margin-top:0;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.stats.small dd{font-size:24px}
.stats.small dd small{font-size:13px}

/* mountain */
details.mtn > summary{list-style:none;cursor:pointer}
details.mtn > summary::-webkit-details-marker{display:none}
.mt-line{font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-weight:600}
details.mtn[open] .mt-line .disc{transform:rotate(180deg)}
.mt-block{padding:16px 0;border-bottom:1px solid var(--rule-soft)}
.mt-block h3{margin:0 0 10px;font-size:13px;font-weight:700}
.aval{display:flex;gap:14px;align-items:flex-start}
.aval p{margin:0;font-size:15px;line-height:1.5;max-width:60ch}
.aval-badge{flex:none;display:grid;justify-items:center;align-content:center;width:96px;min-height:64px;border:2px solid var(--ink);font-size:12px;font-weight:700;text-align:center;padding:6px}
.aval-badge b{font-size:24px;line-height:1}
.aval-badge.l0{background:var(--page-2)}
.aval-badge.l1{background:#50B848;color:#111}
.aval-badge.l2{background:#FFF200;color:#111}
.aval-badge.l3{background:#F7941E;color:#111}
.aval-badge.l4{background:#ED1C24;color:#111}
.aval-badge.l5{background:#231F20;color:#fff;border-color:#ED1C24}
.snowpack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:end}

<script>
(() => {
'use strict';
const NWS = 'https://api.weather.gov';
const DEFAULT_PLACES = [{ id: 'p-default', name: null, lat: 44.682, lon: -116.162 }];
const STALE_MIN = 15;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('fb.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fb.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('fb.' + k); } catch {} },
};
let places = store.get('places', null) || DEFAULT_PLACES.slice();
let preview = null; // an unsaved place being looked at
const data = new Map(); // id -> {model, source, fetchedAt, error}
let current = Math.min(store.get('index', 0), places.length - 1);
const allPages = () => (preview ? [...places, preview] : places);

/* ---------- fetching ---------- */
async function nws(url) {
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(url, { headers: { Accept: 'application/geo+json' } });
      if (r.ok) return r.json();
      last = new Error('NWS ' + r.status);
      last.status = r.status;
      if (r.status === 404 || r.status === 400) throw last;
    } catch (e) {
      last = e;
      if (e.status === 404 || e.status === 400) throw e;
      if (e instanceof TypeError && i >= 1) throw e; // blocked or offline: one quick retry is enough
    }
    await new Promise((s) => setTimeout(s, 500 * (i + 1)));
  }
  throw last;
}
const OBS_KEYS = ['timestamp', 'textDescription', 'temperature', 'windDirection', 'windSpeed', 'windGust', 'relativeHumidity', 'windChill', 'heatIndex', 'visibility'];
async function latestObs(stationsUrl) {
  const st = await nws(stationsUrl);
  for (const f of st.features.slice(0, 3)) {
    try {
      const o = (await nws(`${NWS}/stations/${f.properties.stationIdentifier}/observations/latest`)).properties;
      if (o.temperature && o.temperature.value != null && Date.now() - Date.parse(o.timestamp) < 6 * 3600e3) {
        return {
          station: { id: f.properties.stationIdentifier, name: f.properties.name, elevM: f.properties.elevation?.value ?? null, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] },
          obs: Object.fromEntries(OBS_KEYS.map((k) => [k, o[k]])),
        };
      }
    } catch {}
  }
  return null;
}
const GRID_KEYS = ['snowfallAmount', 'windGust', 'snowLevel', 'apparentTemperature', 'dewpoint', 'skyCover', 'quantitativePrecipitation', 'iceAccumulation', 'windSpeed', 'weather'];
async function fetchRaw(p) {
  const lat = p.lat.toFixed(4), lon = p.lon.toFixed(4);
  const pt = (await nws(`${NWS}/points/${lat},${lon}`)).properties;
  const [fc, hr, gr, al, afd, obsR] = await Promise.allSettled([
    nws(pt.forecast), nws(pt.forecastHourly), nws(pt.forecastGridData), nws(`${NWS}/alerts/active?point=${lat},${lon}`),
    nws(`${NWS}/products/types/AFD/locations/${pt.cwa}/latest`),
    latestObs(pt.observationStations),
  ]);
  if (fc.status !== 'fulfilled' || hr.status !== 'fulfilled') throw (fc.reason || hr.reason);
  const g = gr.status === 'fulfilled' ? gr.value.properties : {};
  return {
    fetchedAt: new Date().toISOString(),
    point: { properties: pt },
    forecast: fc.value,
    hourly: { properties: { updateTime: hr.value.properties.updateTime, periods: hr.value.properties.periods } },
    grid: { properties: Object.fromEntries(GRID_KEYS.map((k) => [k, g[k]])) },
    alerts: al.status === 'fulfilled' ? al.value : { features: [] },
    obs: obsR.status === 'fulfilled' ? obsR.value : null,
    afd: afd.status === 'fulfilled' ? { issuanceTime: afd.value.issuanceTime, productText: afd.value.productText } : null,
  };
}
let snapshotP = null;
const loadSnapshot = () => (snapshotP ||= fetch('snapshot.json').then((r) => (r.ok ? r.json() : null)).catch(() => null));

async function refresh(p, { force = false } = {}) {
  const cached = store.get('cache.' + p.id, null);
  const cur = data.get(p.id);
  if (!cur && cached) setData(p, cached, 'cache');
  const age = cached ? (Date.now() - Date.parse(cached.fetchedAt)) / 60000 : Infinity;
  if (!force && age < STALE_MIN) return;
  if (cur && cur.loading) return;
  const d = data.get(p.id) || {};
  data.set(p.id, { ...d, loading: true });
  renderStatus(p);
  try {
    const raw = await fetchRaw(p);
    if (!p.preview) store.set('cache.' + p.id, raw);
    setData(p, raw, 'live');
  } catch (err) {
    const have = data.get(p.id);
    if (have && have.model) { data.set(p.id, { ...have, loading: false, offline: true }); renderPage(p); return; }
    if (err && err.status === 404) { data.set(p.id, { error: 'outside' }); renderPage(p); return; }
    const snap = await loadSnapshot();
    if (snap && near(p, snap)) { setData(p, snap, 'snapshot'); return; }
    data.set(p.id, { error: 'network' });
    renderPage(p);
  }
}
const near = (p, snap) => Math.abs(p.lat - 44.682) < 0.02 && Math.abs(p.lon + 116.162) < 0.02 && snap;
function setData(p, raw, source) {

      <p class="psnow">${q.snowIn != null && q.snowIn >= 0.1 ? `${q.snowIn.toFixed(1)}″ snow` : ''}</p>
    </button>`;
  }).join('');

  const o = m.obs;
  const stat = (label, val, unit) => `<div><dt>${esc(label)}</dt><dd>${val}${unit ? `<small>${unit}</small>` : ''}</dd></div>`;
  const obs = o ? `<dl class="stats">
      ${stat(o.sky, o.tempF, '°F')}
      ${o.windMph != null ? stat('Wind', o.windMph === 0 ? 'Calm' : o.windMph, o.windMph === 0 ? '' : ` mph ${esc(o.windDir)}`) : ''}
      ${o.gustMph ? stat('Gusts', o.gustMph, ' mph') : ''}
      ${o.rh != null ? stat('Humidity', o.rh, '%') : ''}
      ${o.chillF != null ? stat('Wind chill', o.chillF, '°') : o.heatF != null ? stat('Heat index', o.heatF, '°') : ''}
      ${o.visMi != null ? stat('Visibility', o.visMi, ' mi') : ''}
    </dl>
    <p class="caption">${esc(o.station)}${o.stElevFt != null ? `, ${o.stElevFt.toLocaleString()} ft` : ''}, ${esc(o.dist)} of this spot · observed ${esc(m.fmt(o.at, { weekday: 'short', hour: 'numeric', minute: '2-digit' }))}${Date.now() - o.at > 3 * 3600e3 ? ' <b>(over 3 hours old)</b>' : ''}</p>`
    : `<p class="caption">No recent observation from a nearby NWS station.</p>`;

  let level = '';
  if (m.snowLevelFt != null && m.elevFt != null) {
    const diff = Math.round((m.elevFt - m.snowLevelFt) / 10) * 10;
    const rel = Math.abs(diff) < 200 ? 'right at this spot' : diff > 0 ? `${diff.toLocaleString()} ft below this spot` : `${(-diff).toLocaleString()} ft above this spot`;
    level = `<p class="sec-note">Snow level <b>${(Math.round(m.snowLevelFt / 100) * 100).toLocaleString()} ft</b>, ${rel}</p>`;
  }

  return `<div class="status">${statusHTML(m, d)}</div>${alerts}${glance}
    <section class="sec periods" aria-labelledby="h-per-${esc(p.id)}">
      <div class="sec-row"><h2 class="sec-t" id="h-per-${esc(p.id)}">Forecast periods</h2><span class="sec-tools"><button class="step" type="button" data-step="-1" aria-label="Earlier periods">${ICON.left}</button><button class="step" type="button" data-step="1" aria-label="Later periods">${ICON.right}</button><a class="ext" href="${mapUrl}" target="_blank" rel="noopener">Open on weather.gov${ext}</a></span></div>
      <div class="pstrip" role="group" aria-label="Forecast periods. Choose one for hour-by-hour detail.">${cards}</div>
      <p class="caption">Point forecast for ${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}${m.elevFt != null ? ` at ${Math.round(m.elevFt).toLocaleString()} ft` : ''}${m.near ? `, ${esc(m.near)}` : ''} · NWS ${esc(m.office)} · issued ${esc(m.fmt(m.issued, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}. Tap a period for hour-by-hour detail.</p>
    </section>
    ${totalsHTML(p, m)}
    <section class="sec obs" aria-labelledby="h-obs-${esc(p.id)}">
      <div class="sec-row"><h2 class="sec-t" id="h-obs-${esc(p.id)}">Current conditions</h2><span class="sec-note">Nearest NWS observing station</span></div>
      ${obs}
      <div data-x="climate">${climateHTML(p, m)}</div>
    </section>
    <section class="sec trace" aria-labelledby="h-24-${esc(p.id)}">
      <div class="sec-row"><h2 class="sec-t" id="h-24-${esc(p.id)}">Next 24 hours</h2>${level}</div>
      <div class="readout" data-readout></div>
      <div class="chart" tabindex="0" role="img" aria-roledescription="chart" aria-label="${esc(traceSummary(m))}. Use arrow keys to read each hour."></div>
    </section>
    <div data-x="mountain">${mountainHTML(p, m)}</div>
    <section class="sec detail" aria-labelledby="h-det-${esc(p.id)}">
      <div class="sec-row"><h2 class="sec-t" id="h-det-${esc(p.id)}">Detailed forecast</h2><span class="sec-note">National Weather Service</span></div>
      <dl class="dlist">${m.periods.map((q) => `<div><dt>${esc(q.name)}</dt><dd>${esc(q.detailed)}</dd></div>`).join('')}</dl>
    </section>
    <section class="sec locmap" aria-labelledby="h-map-${esc(p.id)}">
      <div class="sec-row"><h2 class="sec-t" id="h-map-${esc(p.id)}">Map and radar</h2><button class="linkbtn" type="button" data-fullmap>Open full map</button></div>
      <div class="mini" data-mini><div class="mini-tools"><button class="mt" type="button" data-mini-radar aria-pressed="true">${ICON.radar}Radar</button></div>${radarPanel()}</div>
      <p class="caption">${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}${m.elevFt != null ? ' · ' + Math.round(m.elevFt).toLocaleString() + ' ft' : ''}</p>
    </section>
    ${afdHTML(m, afd)}
    <div class="foot"><span>Forecast from the National Weather Service ${esc(m.office)} office, grid ${esc(m.grid)}.</span>
      <span><a href="${mapUrl}" target="_blank" rel="noopener">This forecast on weather.gov</a> · <a href="${afd}" target="_blank" rel="noopener">Forecast discussion on weather.gov</a></span></div>`;
}
function afdHTML(m, url) {
  const a = m.afd;
  const head = `<div class="sec-row"><h2 class="sec-t">Forecast discussion</h2><span class="sec-note">NWS ${esc((a && a.office) || m.office)}</span></div>`;
  if (!a || !a.sections.length) return `<section class="sec afd">${head}<p class="afd-meta">The discussion from the ${esc(m.office)} office isn't available right now. <a href="${url}" target="_blank" rel="noopener">Read it on weather.gov</a></p></section>`;
  const firstOpen = a.sections.findIndex((x) => !/^Update$/.test(x.name));
  const body = (b) => b.list ? `<ul>${b.list.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : b.lines ? `<p>${b.lines.map(esc).join('<br>')}</p>` : `<p>${esc(b.text)}</p>`;
  return `<section class="sec afd">${head}
    <p class="afd-meta">Written by forecasters at NWS ${esc(a.office || m.office)}, issued ${esc(m.fmt(a.issued, { weekday: 'short', hour: 'numeric', minute: '2-digit' }))}. It explains the reasoning behind the forecast for the whole region.</p>
    ${a.sections.map((x, i) => `<details class="afd-sec"${i === firstOpen ? ' open' : ''}><summary><span><b>${esc(x.name)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</span><svg class="disc" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg></summary><div class="afd-body">${x.blocks.map(body).join('')}${x.issued ? `<p class="afd-issued">Issued ${esc(x.issued)}</p>` : ''}</div></details>`).join('')}
    <p class="afd-meta"><a href="${url}" target="_blank" rel="noopener">Full discussion on weather.gov</a></p>
  </section>`;
}
function traceSummary(m) {
  const t = m.hours.map((h) => h.temp);
  const hi = Math.max(...t), lo = Math.min(...t);
  const hiH = m.hours[t.indexOf(hi)], loH = m.hours[t.indexOf(lo)];
  const f = (h) => m.fmt(h.t, { hour: 'numeric' });
  return `Next 24 hours: high ${hi}° at ${f(hiH)}, low ${lo}° at ${f(loH)}, highest precip chance ${Math.max(...m.hours.map((h) => h.pop))}%`;
}

/* ---------- the pencil trace ---------- */
function drawTrace(pageEl, m, animate) {
  const box = pageEl.querySelector('.chart');
  const ro = pageEl.querySelector('[data-readout]');
  if (!box) return;
  const H = m.hours;
  const n = H.length;
  const draw = () => {
    const W = Math.max(280, Math.round(box.clientWidth || 340));
    const L = 34, R = 6, T = 22, PH = 96, ST = T + PH + 18, SH = 32, AX = ST + SH + 14, HT = AX + 6;
    const temps = H.map((h) => h.temp);
    const mn = Math.min(...temps), mx = Math.max(...temps), span = mx - mn;
    const step = span <= 6 ? 2 : span <= 14 ? 4 : span <= 24 ? 5 : 10;
    const lo = Math.floor((mn - 1) / step) * step, hi = Math.ceil((mx + 1) / step) * step;
    const x = (i) => L + (i * (W - L - R)) / (n - 1);
    const y = (v) => T + PH - ((v - lo) / (hi - lo)) * PH;
    const px = (v) => Math.round(v) + 0.5;
    const hid = 'hatch-' + String(m.grid).replace(/\W/g, '_');
    let s = `<svg viewBox="0 0 ${W} ${HT}" height="${HT}" aria-hidden="true"><defs><pattern id="${hid}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="var(--rule)" stroke-width="1.2" opacity=".55"/></pattern></defs>`;
    for (let v = lo; v <= hi; v += step) s += `<path class="r-soft" d="M${L} ${px(y(v))}H${W - R}"/><text class="t-ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}°</text>`;
    // snow blocks, as hatched columns behind the precip strip
    for (const b of m.snowBlocks) {
      const i0 = Math.max(0, (b.s - H[0].t) / 3600e3), i1 = Math.min(n - 1, (b.e - H[0].t) / 3600e3);
      if (i1 <= i0 || b.inch < 0.05) continue;
      s += `<rect x="${x(i0)}" y="${ST}" width="${x(i1) - x(i0)}" height="${SH}" fill="url(#${hid})"/>`;
      s += `<text class="t-snow" x="${(x(i0) + x(i1)) / 2}" y="${ST - 3}" text-anchor="middle">${b.inch.toFixed(1)}″ snow</text>`;
    }
    s += `<path class="r" d="M${L} ${px(ST)}H${W - R}M${L} ${px(ST + SH)}H${W - R}"/><path class="r-soft" stroke-dasharray="2 3" d="M${L} ${px(ST + SH / 2)}H${W - R}"/>`;
    s += `<text class="t-ax" x="${L - 6}" y="${ST + 4}" text-anchor="end">100%</text><text class="t-ax" x="${L - 6}" y="${ST + SH / 2 + 3.5}" text-anchor="end">50</text><text class="t-ax" x="${L - 6}" y="${ST + SH + 3}" text-anchor="end">0</text>`;
    const bw = Math.max(3, ((W - L - R) / (n - 1)) * 0.55);
    H.forEach((h, i) => { if (h.pop > 0) { const bh = (h.pop / 100) * SH; s += `<rect class="pcp" x="${x(i) - bw / 2}" y="${ST + SH - bh}" width="${bw}" height="${bh}"/>`; } });
    // hour ticks and day boundaries
    H.forEach((h, i) => {
      const hr = +m.fmt(h.t, { hour: 'numeric', hourCycle: 'h23' });
      if (hr === 0) {
        s += `<path class="r" d="M${px(x(i))} ${T - 8}V${ST + SH}"/><text class="t-day" x="${x(i) + 4}" y="${T - 10}">${m.fmt(h.t, { weekday: 'short' }).toUpperCase()}</text>`;
      }
      if (hr % 3 === 0 && i > 0 && i < n - 1) {
        s += `<path class="r" d="M${px(x(i))} ${ST + SH}v4"/><text class="t-ax" x="${x(i)}" y="${AX}" text-anchor="middle">${hr === 0 ? '12a' : hr === 12 ? '12p' : hr > 12 ? hr - 12 + 'p' : hr + 'a'}</text>`;
      }
    });
    const pts = H.map((h, i) => `${x(i).toFixed(1)},${y(h.temp).toFixed(1)}`).join(' ');
    s += `<path class="nowline" d="M${px(x(0))} ${T - 8}V${ST + SH}"/>`;
    s += `<polyline class="pencil" points="${pts}"/>`;
    const iHi = temps.indexOf(mx), iLo = temps.lastIndexOf(mn);
    const note = (i, above) => {
      const X = Math.min(W - R - 40, Math.max(L + 40, x(i)));
      const Y = above ? y(temps[i]) - 9 : y(temps[i]) + 17;
      return `<text class="t-peak" x="${X}" y="${Y}" text-anchor="middle">${temps[i]}° ${m.fmt(H[i].t, { hour: 'numeric' }).replace(' ', '').toLowerCase()}</text>`;
    };
    if (iHi > 0) s += note(iHi, true);
    if (iLo > 0 && mx - mn >= 2) s += note(iLo, false);
    s += `<circle class="nowdot" cx="${x(0)}" cy="${y(H[0].temp)}" r="4"/>`;
    s += `<g class="cur" visibility="hidden"><path class="cursor" d=""/><circle class="cdot" r="3.5"/></g></svg>`;
    box.innerHTML = s;
    const line = box.querySelector('.pencil');
    if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches && line.getTotalLength) {
      const len = Math.ceil(line.getTotalLength());
      line.style.strokeDasharray = len; line.style.setProperty('--len', len); line.classList.add('draw');
      animate = false;
    }
    box._geom = { x, y, n, L, R, W, T, ST, SH };
  };
  const outlook = (() => {
    const f = (t) => m.fmt(t, { weekday: 'short', hour: 'numeric' });
    const sb = m.snowBlocks.find((b) => b.inch >= 0.05);
    if (sb) { const tot = m.snow24 || 0; return `<span>Snow from <b>${esc(f(Math.max(sb.s, H[0].t)))}</b></span><span><b>${tot.toFixed(1)} in</b> in the next 24 hours</span>`; }
    const pops = H.map((h) => h.pop), pm = Math.max(...pops);
    if (pm >= 20) { const ip = pops.indexOf(pm); return `<span>Precip chance peaks at <b>${pm}%</b> around <b>${esc(f(H[ip].t))}</b></span>`; }
    return `<span>Dry: precip chance stays at or below <b>${pm}%</b></span>`;
  })();
  const read = (i) => {
    const h = H[i];
    ro.innerHTML = i === 0 ? outlook : `<b>${esc(m.fmt(h.t, { weekday: 'short', hour: 'numeric' }))}</b><span><b>${h.temp}°</b></span><span>${esc(h.short)}</span><span>${h.pop}% precip</span><span>${esc(h.dir)} ${esc(h.wind)}</span>`;
    const g = box._geom, c = box.querySelector('.cur');
    if (!g || !c) return;
    if (i === 0) { c.setAttribute('visibility', 'hidden'); return; }
    c.setAttribute('visibility', 'visible');
    const X = g.x(i);
    c.querySelector('.cursor').setAttribute('d', `M${X} ${g.T - 8}V${g.ST + g.SH}`);
    const dot = c.querySelector('.cdot'); dot.setAttribute('cx', X); dot.setAttribute('cy', g.y(H[i].temp));
  };
  draw(); read(0);
  let idx = 0;
  const pick = (ev) => {
    const g = box._geom, r = box.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * g.W;
    idx = Math.max(0, Math.min(g.n - 1, Math.round(((px - g.L) / (g.W - g.L - g.R)) * (g.n - 1))));
    read(idx);
  };
  box.onpointermove = pick;
  box.onpointerdown = pick;
  box.onpointerleave = () => { idx = 0; read(0); };
  box.onkeydown = (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); idx = Math.max(0, Math.min(n - 1, idx + (e.key === 'ArrowRight' ? 1 : -1))); read(idx); }
    if (e.key === 'Home') { idx = 0; read(0); }
  };
  box.onblur = () => { idx = 0; read(0); };
  if (!box._ro && 'ResizeObserver' in window) {
    let lastW = box.clientWidth;
    box._ro = new ResizeObserver(() => { if (Math.abs(box.clientWidth - lastW) > 4) { lastW = box.clientWidth; draw(); read(idx); } });
    box._ro.observe(box);
  }
}

/* ---------- navigation between pages ---------- */
function goTo(i, smooth = true) {
  const pages = allPages();
  i = Math.max(0, Math.min(pages.length - 1, i));
  const el = book.children[i];
  if (!el) return;
  book.scrollTo({ left: el.offsetLeft, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' });
  setCurrent(i);
}
function setCurrent(i) {
  if (i === current && book.children[i]?.dataset.seen) return;
  current = i;
  if (i < places.length) store.set('index', i);
  const pages = allPages();
  const p = pages[i];
  if (!p) return;
  book.children[i].dataset.seen = '1';
  refresh(p);
  if (pages[i + 1]) refresh(pages[i + 1]);
  document.title = placeName(p) + ' · Field Book Forecast';
}
let scrollT;
book.addEventListener('scroll', () => {
  clearTimeout(scrollT);
  scrollT = setTimeout(() => {
    const i = Math.round(book.scrollLeft / book.clientWidth);
    if (i !== current) {
      setCurrent(i);
      allPages().forEach((p, j) => document.querySelectorAll(`#page-${CSS.escape(p.id)} .dots button`).forEach((b, k) => (k === i ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current'))));
    }
  }, 90);
}, { passive: true });
book.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const p = allPages()[current];
  if (t.dataset.goto != null) goTo(+t.dataset.goto);
  else if (t.dataset.turn) goTo(current + +t.dataset.turn);
  else if (t.hasAttribute('data-places')) openPlaces();
  else if (t.hasAttribute('data-retry')) { const pg = allPages()[+t.closest('.page').dataset.i]; data.delete(pg.id); renderPage(pg); refresh(pg, { force: true }); }
  else if (t.hasAttribute('data-save')) savePreview();
  else if (t.hasAttribute('data-discard')) discardPreview();
  else if (t.hasAttribute('data-remove')) removePlace(p.id);
  else if (t.hasAttribute('data-fullmap') || t.dataset.nav === 'map') openMap();
  else if (t.dataset.nav === 'places') openPlaces();
  else if (t.dataset.period != null) openHours(allPages()[+t.closest('.page').dataset.i], +t.dataset.period);
  else if (t.dataset.step) { const st = t.closest('.sec').querySelector('.pstrip'); st.scrollBy({ left: +t.dataset.step * st.clientWidth * 0.8, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  else if (t.dataset.nav === 'search') openSearch();
});
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]') || /INPUT|TEXTAREA/.test(document.activeElement?.tagName) || document.activeElement?.classList.contains('chart')) return;
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

/* ---------- places ---------- */
function persist() { store.set('places', places); }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function showPreview(lat, lon, name) {
  const existing = places.findIndex((p) => Math.abs(p.lat - lat) < 0.005 && Math.abs(p.lon - lon) < 0.005);
  if (existing >= 0) { closeAll(); buildBook(); goTo(existing, false); return; }
  if (preview) { data.delete(preview.id); }
  preview = { id: 'preview-' + Date.now(), name: name || null, lat: +lat, lon: +lon, preview: true };
  closeAll();
  buildBook();
  goTo(allPages().length - 1, false);
}
function savePreview() {
  if (!preview) return;
  const p = { id: 'p-' + Date.now().toString(36), name: preview.name || placeName(preview), lat: preview.lat, lon: preview.lon };
  const d = data.get(preview.id);
  data.delete(preview.id);
  if (d) data.set(p.id, d);
  places.push(p); preview = null; persist();
  buildBook(); goTo(places.length - 1, false);
  refresh(p, { force: true });
  toast(`Saved ${p.name}`);
}
function discardPreview() { if (!preview) return; data.delete(preview.id); preview = null; buildBook(); goTo(Math.min(current, places.length - 1), false); }
function removePlace(id) {
  const i = places.findIndex((p) => p.id === id);
  if (i < 0) return;
  const [gone] = places.splice(i, 1);
  store.del('cache.' + id); data.delete(id); persist();
  buildBook(); renderPlaces(); goTo(Math.min(current, allPages().length - 1), false);
  if (!places.length) { renderPlacesEmpty(); }
  toast(`Removed ${gone.name || 'place'}`);
}

const dlgPlaces = $('#dlgPlaces'), dlgSearch = $('#dlgSearch'), dlgMap = $('#dlgMap');
function closeAll() { document.querySelectorAll('dialog[open]').forEach((d) => d.close()); }
document.querySelectorAll('dialog').forEach((d) => {
  d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
});
function renderPlacesEmpty() { if (!places.length) $('#plist').innerHTML = '<li style="display:block;border:0"><p class="note">No saved places yet. Add one below.</p></li>'; }
function renderPlaces(editId) {
  const ul = $('#plist');
  if (!places.length) return renderPlacesEmpty();
  ul.innerHTML = places.map((p, i) => {
    const d = data.get(p.id), m = d && d.model;
    const meta = m ? `${m.now.temp}° · ${m.now.short}` : `${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}`;
    if (editId === p.id) return `<li><span class="num">${i + 1}</span><form data-rename="${esc(p.id)}" style="display:flex;gap:6px;grid-column:2/4"><label class="vh" for="rn-${esc(p.id)}">Name</label><input id="rn-${esc(p.id)}" value="${esc(placeName(p))}" maxlength="40" required><button class="btn solid" type="submit">Save</button></form></li>`;
    return `<li><span class="num">${i + 1}</span><button class="go" type="button" data-open="${i}"><b>${esc(placeName(p))}</b><small>${esc(meta)}</small></button>
      <span class="tools">${i > 0 ? `<button class="icon-btn" type="button" data-up="${esc(p.id)}" aria-label="Move ${esc(placeName(p))} up">${ICON.up}</button>` : ''}<button class="icon-btn" type="button" data-edit="${esc(p.id)}" aria-label="Rename ${esc(placeName(p))}">${ICON.edit}</button><button class="icon-btn" type="button" data-del="${esc(p.id)}" aria-label="Remove ${esc(placeName(p))}">${ICON.trash}</button></span></li>`;
  }).join('');
  const f = ul.querySelector('form'); if (f) { const inp = f.querySelector('input'); inp.focus(); inp.select(); }
}
$('#plist').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open) { dlgPlaces.close(); goTo(+b.dataset.open); }
  else if (b.dataset.edit) renderPlaces(b.dataset.edit);
  else if (b.dataset.del) removePlace(b.dataset.del);
  else if (b.dataset.up) {
    const i = places.findIndex((p) => p.id === b.dataset.up);
    [places[i - 1], places[i]] = [places[i], places[i - 1]]; persist(); buildBook(); renderPlaces(); goTo(Math.min(current, allPages().length - 1), false);
  }
});
$('#plist').addEventListener('submit', (e) => {
  e.preventDefault();
  const id = e.target.dataset.rename, p = places.find((q) => q.id === id);
  const v = e.target.querySelector('input').value.trim();
  if (p && v) { p.name = v; persist(); renderPage(p); }
  renderPlaces();

    const hr = +m.fmt(h.t, { hour: 'numeric', hourCycle: 'h23' });
    if (hr === 0 && i > 0) s += `<path class="r" d="M${px(x(i))} 14V${HT - 18}"/><text class="t-day" x="${x(i) + 4}" y="10">${m.fmt(h.t, { weekday: 'short' }).toUpperCase()}</text>`;
    if (hr % 3 === 0) s += `<text class="t-ax" x="${x(i)}" y="${HT - 4}" text-anchor="middle">${hr === 0 ? '12a' : hr === 12 ? '12p' : hr > 12 ? hr - 12 + 'p' : hr + 'a'}</text>`;
  });
  for (const pn of panels) {
    const top = pn.y, bot = pn.y + pn.h;
    s += `<path class="r" d="M${L} ${px(bot)}H${W - R}"/><text class="t-lab" x="${L}" y="${top - 6}">${pn.label}</text>`;
    if (pn.key === 't') {
      const Y = (v) => bot - ((v - tlo) / (thi - tlo)) * pn.h;
      for (let v = tlo; v <= thi; v += 5) if ((v - tlo) % 10 === 0) s += `<path class="r-soft" d="M${L} ${px(Y(v))}H${W - R}"/><text class="t-ax" x="${L - 5}" y="${Y(v) + 3.5}" text-anchor="end">${v}°</text>`;
      const dp = H.map((h, i) => (h.dewF == null ? null : `${x(i).toFixed(1)},${Y(h.dewF).toFixed(1)}`)).filter(Boolean).join(' ');
      if (dp) s += `<polyline class="dew" points="${dp}"/>`;
      s += `<polyline class="pencil" points="${H.map((h, i) => `${x(i).toFixed(1)},${Y(h.temp).toFixed(1)}`).join(' ')}"/>`;
      s += `<text class="t-key" x="${W - R}" y="${top - 6}" text-anchor="end">— temp  ┄ dew point</text>`;
      pn.Y = Y;
    }
    if (pn.key === 'p') {
      const bw = Math.max(3, ((W - L - R) / Math.max(1, n - 1)) * 0.6);
      for (const b of m.ser.snow) {
        const i0 = Math.max(0, (b.s - H[0].t) / 3600e3), i1 = Math.min(n - 1, (b.e - H[0].t) / 3600e3);
        if (i1 <= i0 || !b.v || MM2IN(b.v) < 0.05) continue;
        s += `<rect x="${x(i0)}" y="${top}" width="${x(i1) - x(i0)}" height="${pn.h}" fill="url(#${hid})"/><text class="t-snow" x="${(x(i0) + x(i1)) / 2}" y="${top + 11}" text-anchor="middle">${MM2IN(b.v).toFixed(1)}″ snow</text>`;
      }
      H.forEach((h, i) => { if (h.pop > 0) { const bh = (h.pop / 100) * (pn.h - 14); s += `<rect class="pcp" x="${Math.min(W - R - bw, Math.max(L, x(i) - bw / 2))}" y="${bot - bh}" width="${bw}" height="${bh}"/>`; } });
      s += `<text class="t-ax" x="${L - 5}" y="${top + 17}" text-anchor="end">100%</text><text class="t-ax" x="${L - 5}" y="${bot}" text-anchor="end">0</text>`;
    }
    if (pn.key === 'w') {
      const Y = (v) => bot - (v / whi) * pn.h;
      s += `<path class="r-soft" d="M${L} ${px(Y(whi / 2))}H${W - R}"/><text class="t-ax" x="${L - 5}" y="${Y(whi) + 9}" text-anchor="end">${whi}</text><text class="t-ax" x="${L - 5}" y="${Y(whi / 2) + 3.5}" text-anchor="end">${whi / 2}</text>`;
      const wp = winds.map((v, i) => (v == null ? null : `${x(i).toFixed(1)},${Y(v).toFixed(1)}`)).filter(Boolean).join(' ');
      if (wp) s += `<polyline class="windl" points="${wp}"/>`;
      gusts.forEach((g, i) => { if (g != null) s += `<circle class="gustd" cx="${x(i)}" cy="${Y(g)}" r="2.2"/>`; });
      s += `<text class="t-key" x="${W - R}" y="${top - 6}" text-anchor="end">— speed  · gusts</text>`;
    }
    if (pn.key === 'c') {
      const pts = H.map((h, i) => { const v = at(m.ser.sky, h.t); return `${x(i).toFixed(1)},${(bot - ((v ?? 0) / 100) * pn.h).toFixed(1)}`; });
      s += `<polygon class="skyfill" points="${x(0)},${bot} ${pts.join(' ')} ${x(n - 1)},${bot}"/>`;
    }
    if (pn.key === 's') {
      const lv = levels.filter((v) => v != null), lo = Math.min(m.elevFt, ...lv), hi = Math.max(m.elevFt, ...lv);
      const a = Math.floor((lo - 300) / 1000) * 1000, b = Math.ceil((hi + 300) / 1000) * 1000;
      const Y = (v) => bot - ((v - a) / (b - a)) * pn.h;
      s += `<text class="t-ax" x="${L - 5}" y="${Y(b) + 9}" text-anchor="end">${(b / 1000).toFixed(0)}k</text><text class="t-ax" x="${L - 5}" y="${bot}" text-anchor="end">${(a / 1000).toFixed(0)}k</text>`;
      s += `<path class="elev" d="M${L} ${Y(m.elevFt)}H${W - R}"/><text class="t-key" x="${W - R}" y="${Y(m.elevFt) - 4}" text-anchor="end">this spot ${Math.round(m.elevFt).toLocaleString()} ft</text>`;
      const lp = levels.map((v, i) => (v == null ? null : `${x(i).toFixed(1)},${Y(v).toFixed(1)}`)).filter(Boolean).join(' ');
      s += `<polyline class="levell" points="${lp}"/>`;
    }
  }
  s += `<g class="cur" visibility="hidden"><path class="cursor" d="M0 4V${HT - 18}"/><circle class="cdot" r="3.5"/></g></svg>`;
  box.innerHTML = s;
  const tp = panels[0];
  const read = (i) => {
    const h = H[i], g = gusts[i], lv = levels[i], sk = at(m.ser.sky, h.t);
    ro.innerHTML = `<b>${esc(m.fmt(h.t, { weekday: 'short', hour: 'numeric' }))}</b><span><b>${h.temp}°</b>${h.dewF != null ? ` dew ${Math.round(h.dewF)}°` : ''}</span><span>${esc(h.short)}</span><span>${h.pop}% precip</span><span>${esc(h.dir)} ${esc(h.wind)}${g != null && g >= 15 ? `, gusts ${Math.round(g)}` : ''}</span>${sk != null ? `<span>${Math.round(sk)}% clouds</span>` : ''}${lv != null ? `<span>snow level ${(Math.round(lv / 100) * 100).toLocaleString()} ft</span>` : ''}`;
    const c = box.querySelector('.cur'); c.setAttribute('visibility', 'visible');
    c.querySelector('.cursor').setAttribute('transform', `translate(${x(i)} 0)`);
    const dot = c.querySelector('.cdot'); dot.setAttribute('cx', x(i)); dot.setAttribute('cy', tp.Y(h.temp));
  };
  let idx = 0; read(0);
  const pick = (ev) => { const r = box.getBoundingClientRect(); idx = Math.max(0, Math.min(n - 1, Math.round((((ev.clientX - r.left) / r.width) * W - L) / ((W - L - R) / Math.max(1, n - 1))))); read(idx); };
  box.onpointermove = pick; box.onpointerdown = pick;
  box.onkeydown = (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); idx = Math.max(0, Math.min(n - 1, idx + (e.key === 'ArrowRight' ? 1 : -1))); read(idx); } };
}
$('#hPrev').onclick = () => { if (hoursState && hoursState.idx > 0) { hoursState.idx--; renderHours(); } };
$('#hNext').onclick = () => { if (hoursState && hoursState.idx < hoursState.m.periods.length - 1) { hoursState.idx++; renderHours(); } };


/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { const p = allPages()[current]; if (p) refresh(p); } });
window.addEventListener('online', () => { const p = allPages()[current]; if (p) refresh(p, { force: true }); });
setInterval(() => { allPages().forEach((p) => { const d = data.get(p.id); if (d && d.model) renderStatus(p); }); }, 60000);

buildBook();
setTimeout(() => { goTo(current, false); setCurrent(current); places.forEach((p) => refresh(p)); }, 0);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
